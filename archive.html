<style>
@font-face{font-family:"Work Sans";font-style:normal;font-weight:300 600;font-display:swap;src:url("assets/fonts/worksans-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215;}
@font-face{font-family:"Work Sans";font-style:normal;font-weight:300 600;font-display:swap;src:url("assets/fonts/worksans-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+1E00-1E9F;}

:root{
  --ground:#e6e1d6; --ground-2:#dbd5c6; --ground-3:#cfc8b5;
  --ink:#1b1917; --ink-2:#413c34; --ink-3:#5f5849;
  --on-ink:#efeee9; --on-ink-2:#b0a896;
  --accent:#a16207; --accent-ink:#7a4a05;
  --fs-display-a:clamp(46px,7.5vw,110px);
  --fs-h:clamp(26px,2.6vw,36px);
  --fs-row:clamp(17px,1.3vw,20px);
  --fs-body:16px;
  --pad:clamp(20px,4vw,48px);
  --w:1180px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);overflow-x:hidden;font-family:"Work Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none}
h1,h2,p{margin:0}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ══ 顶栏 ══════════════════════════════════ */
.top{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:var(--pad)}
.back{font-size:var(--fs-body);color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;transition:color .16s var(--ease)}
.back:hover{color:var(--accent-ink)}
.top nav{display:flex;gap:24px;flex-wrap:wrap}
.top nav a{font-size:var(--fs-body);color:var(--ink-2);transition:color .16s var(--ease)}
.top nav a:hover{color:var(--accent-ink)}

.wrap{max-width:var(--w);margin:0 auto;padding:0 var(--pad)}

/* ══ 头 ══════════════════════════════════ */
.head{padding:4px 0 0}
.head h1{font-size:var(--fs-display-a);font-weight:600;line-height:1.0;letter-spacing:-.035em}
.head p{margin-top:18px;font-size:var(--fs-row);line-height:1.45;color:var(--ink-2);max-width:40ch}

/* ══ 检索 ══════════════════════════════════ */
.tools{padding:36px 0 0}
.search{display:block}
.search input{width:100%;height:62px;padding:0 20px;font:inherit;font-size:var(--fs-row);background:var(--ground-3);color:var(--ink);border:0;border-radius:0;transition:background .16s var(--ease)}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{background:var(--ground-2);outline:3px solid var(--accent);outline-offset:0}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.chip{border:0;cursor:pointer;font:inherit;font-size:var(--fs-body);background:var(--ground-3);color:var(--ink-2);padding:10px 15px;border-radius:0;transition:background .16s var(--ease),color .16s var(--ease)}
.chip:hover{color:var(--accent-ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:6px}

/* ══ 列表（图墙） ══════════════════════════════ */
.count{padding:40px 0 0;font-size:var(--fs-row);color:var(--ink-2)}
.count b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.yr{margin-top:56px}
.yr:first-child{margin-top:8px}
.yr-h{display:flex;gap:14px;align-items:baseline;margin:0 0 26px;font-size:var(--fs-h);font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.yr-h .n{font-size:15px;color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:32px 26px}
.card{display:block}
.thumb{display:block;position:relative;aspect-ratio:4/3;background:var(--ground-2);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top left;transition:transform .5s var(--ease)}
.card:hover .thumb img,.card:focus-visible .thumb img{transform:scale(1.05)}
.tile{display:none}
.card.noimg .thumb{background:var(--ink)}
.card.noimg img{display:none}
.card.noimg .tile{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;padding:10%;color:var(--on-ink);font-size:clamp(15px,1.4vw,18px);line-height:1.2;font-weight:500;text-align:center}
.meta{display:block;margin-top:13px}
.meta b{display:block;font-size:var(--fs-row);font-weight:500;color:var(--ink);line-height:1.3;transition:color .16s var(--ease)}
.card:hover .meta b,.card:focus-visible .meta b{color:var(--accent-ink)}
.meta .cm{display:block;margin-top:4px;font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.more{margin:48px 0 0;border:0;cursor:pointer;font:inherit;font-size:var(--fs-body);background:var(--ink);color:var(--on-ink);padding:15px 30px;border-radius:0;transition:background .18s var(--ease),transform .18s var(--ease)}
.more:hover{background:var(--accent);transform:translateY(-2px)}
.empty{margin-top:12px;font-size:var(--fs-row);color:var(--ink-2)}

/* ══ 入场 ══════════════════════════════════ */
.js [data-rv]{opacity:0;transform:translateY(18px)}
.js [data-rv].in{opacity:1;transform:none;transition:opacity .5s var(--ease) var(--i,0ms),transform .5s var(--ease) var(--i,0ms)}

/* ══ 页脚 ══════════════════════════════════ */
.foot{margin-top:96px;background:var(--ink);color:var(--on-ink);padding:48px var(--pad) 28px;display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap}
.foot a{font-size:var(--fs-body);color:var(--on-ink-2);transition:color .16s var(--ease)}
.foot a:hover{color:var(--on-ink)}
.foot p{font-size:var(--fs-body);color:var(--on-ink-2)}

@media(max-width:760px){
  :root{--fs-row:18px}
  .head{padding-top:8px}
  .tools{padding-top:32px}
  .search input{height:54px;font-size:16px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
  .yr{margin-top:44px}
  .foot{flex-direction:column;gap:10px;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js [data-rv]{opacity:1;transform:none}
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>

<header class="top">
  <a class="back" href="index.html"><span aria-hidden="true">←</span> GERVAS</a>
  <nav aria-label="站内导航">
    <a href="index.html">最新</a>
    <a href="https://github.com/eastseao/rc">GitHub</a>

</header>

<div class="wrap">
  <section class="head">
    <h1>全部作品</h1>
    <p>GERVAS 的全部 815 篇笔记与工具，按年倒排，九类可分，标题、摘要和标签都能搜。</p>
  </section>

  <section class="tools">
    <div class="search">
      <label class="sr" for="q">搜索作品</label>
      <input id="q" type="search" placeholder="搜标题、摘要、标签" autocomplete="off">
    </div>
    <div class="chips" id="chips" role="group" aria-label="按分类筛选">
      <button class="chip" type="button" data-cat="全部" aria-pressed="true">全部<span class="n">815</span></button>
      <button class="chip" type="button" data-cat="建站与技术" aria-pressed="false">建站与技术<span class="n">240</span></button>
      <button class="chip" type="button" data-cat="AI与Agent" aria-pressed="false">AI 与 Agent<span class="n">120</span></button>
      <button class="chip" type="button" data-cat="写作与创作" aria-pressed="false">写作与创作<span class="n">104</span></button>
      <button class="chip" type="button" data-cat="生活杂记" aria-pressed="false">生活杂记<span class="n">101</span></button>
      <button class="chip" type="button" data-cat="本草与健康" aria-pressed="false">本草与健康<span class="n">98</span></button>
      <button class="chip" type="button" data-cat="产品与渠道" aria-pressed="false">产品与渠道<span class="n">63</span></button>
      <button class="chip" type="button" data-cat="包装包材" aria-pressed="false">包装包材<span class="n">46</span></button>
      <button class="chip" type="button" data-cat="采购与供应链" aria-pressed="false">采购与供应链<span class="n">39</span></button>
      <button class="chip" type="button" data-cat="博物与自然" aria-pressed="false">博物与自然<span class="n">4</span></button>
    </div>
  </section>

  <p class="count" id="count" aria-live="polite"></p>

  <div class="grid" id="list">
    <noscript>
      <section class="yr"><h2 class="yr-h"><span>最新几篇</span></h2><div class="cards">
        <a class="card" href="pages/first-principles-2026.html"><span class="thumb"><img src="assets/works/first-principles-2026.jpg" alt=""></span><span class="meta"><b>第一性原理 · 从不可约事实重建答案</b><span class="cm">建站与技术 · 2026-10-28</span></span></a>
        <a class="card" href="pages/china-fruit-varieties-2026.html"><span class="thumb"><img src="assets/works/china-fruit-varieties-2026.jpg" alt=""></span><span class="meta"><b>中国水果品种全集 · 477 个品种</b><span class="cm">博物与自然 · 2026-10-27</span></span></a>
        <a class="card" href="pages/miniprogram-dev-flow-2026.html"><span class="thumb"><img src="assets/works/miniprogram-dev-flow-2026.jpg" alt=""></span><span class="meta"><b>微信小程序从 0 到上线</b><span class="cm">建站与技术 · 2026-10-20</span></span></a>
      </div></section>
    </noscript>
  </div>

  <p class="empty" id="empty" hidden>没有匹配的作品。换个词，或点「全部」。</p>

</div>

<script src="manifest.js"></script>
<script>
(function(){
  'use strict';
  var docEl = document.documentElement;
  docEl.className = docEl.className.replace('no-js','js');
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var slugOf = function(u){ return (u||'').replace(/^pages\//,'').replace(/^tools\//,'').replace(/\/index\.html$/,'').replace(/\.html$/,''); };
  var FIRST = 50, STEP = 50;
  var WORKS = window.WORKS;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!Array.isArray(WORKS)) {
    var l0 = $('list');
    if (l0) l0.insertAdjacentHTML('afterbegin','<p class="empty">作品数据未能加载，刷新页面即可。</p>');
    return;
  }

  var sorted = WORKS.slice().sort(function(a,b){ return (b.d||'').localeCompare(a.d||''); });
  var state = { cat:'全部', q:'', shown:FIRST };

  try { var cp = new URLSearchParams(location.search).get('cat'); if (cp) state.cat = cp; } catch(e){}

  function filtered(){
    var q = state.q.toLowerCase();
    return sorted.filter(function(w){
      if (state.cat !== '全部' && w.c !== state.cat) return false;
      if (q) {
        var hay = (w.t + ' ' + (w.desc||'') + ' ' + ((w.g||[]).join(' '))).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function render(){
    var list = filtered();
    var box = $('list'), cnt = $('count'), more = $('more'), empty = $('empty');
    var slice = list.slice(0, state.shown);

    cnt.innerHTML = state.cat === '全部' && !state.q
      ? '共 <b>' + list.length + '</b> 篇'
      : '匹配 <b>' + list.length + '</b> 篇（共 ' + sorted.length + ' 篇）';

    if (!slice.length) { box.innerHTML = ''; empty.hidden = false; more.hidden = true; return; }
    empty.hidden = true;

    var html = '', year = '', ci = 0;
    slice.forEach(function(w){
      var y = (w.d||'').slice(0,4);
      if (y !== year) {
        if (year) html += '</div></section>';
        var n = list.filter(function(x){ return (x.d||'').slice(0,4) === y; }).length;
        html += '<section class="yr"><h2 class="yr-h"><span>' + esc(y) + '</span><span class="n">' + n + ' 篇</span></h2><div class="cards">';
        year = y;
      }
      var slug = slugOf(w.u);
      var rv = ci < 16 ? ' data-rv' : '';
      html += '<a class="card" href="' + esc(w.u) + '"' + rv + '>'
        + '<span class="thumb"><img src="assets/works/' + slug + '.jpg" alt="' + esc(w.t) + ' 页面截图" loading="lazy" onerror="this.closest(\'.card\').classList.add(\'noimg\')"><span class="tile">' + esc(w.t) + '</span></span>'
        + '<span class="meta"><b>' + esc(w.t) + '</b><span class="cm">' + esc(w.c) + ' · ' + esc(w.d) + '</span></span></a>';
      ci++;
    });
    if (year) html += '</div></section>';
    box.innerHTML = html;

    if (!reduced) {
      var fresh = [].slice.call(box.querySelectorAll('[data-rv]')).slice(0, 16);
      fresh.forEach(function(el, i){
        el.style.setProperty('--i', Math.min(i, 12) * 30 + 'ms');
        el.classList.add('rv');
      });
      requestAnimationFrame(function(){ fresh.forEach(function(el){ el.classList.add('in'); }); });
    }

    more.hidden = list.length <= state.shown;
    empty.hidden = list.length > 0;
    if (list.length > state.shown) more.textContent = '再显示 ' + Math.min(STEP, list.length - state.shown) + ' 篇';
  }

  function syncChips(){
    [].forEach.call(document.querySelectorAll('.chip'), function(b){
      b.setAttribute('aria-pressed', b.getAttribute('data-cat') === state.cat ? 'true' : 'false');
    });
  }

  $('chips').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if (!b) return;
    state.cat = b.getAttribute('data-cat'); state.shown = FIRST; syncChips(); render();
  });
  var q = $('q');
  if (q) q.addEventListener('input', function(){ state.q = q.value.trim(); state.shown = FIRST; render(); });
  $('more').addEventListener('click', function(){ state.shown += STEP; render(); });

  syncChips(); render();
})();
</script>
</body>
</html>
