<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常 · Agent 作品集</title>
<meta name="description" content="日常 Agent 产出的网页合集 —— 金融分析、行业研究、数据报告，持续更新。">
<!--
  排版重构：与 skill.html / prompt.html 同源——暖纸底 + 陶土红单 accent + mono 元数据 + hairline
  保留边界：登记表 JS（PAGES / 搜索 / 分类筛选 / 统计）字节未动；缩略图渐变由 CSS 统一压为纸色
-->
<style>
  :root{
    --bg:#faf9f7; --surface:#fffefb; --ink:#1c1b1a; --muted:#6d6a63; --border:#e6e3dc;
    --code:#f4f2ed; --accent:#c96442; --accent-ink:#a2431f;
    --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
    --sans:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}

  /* ── 顶栏 ── */
  .topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .brand{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.02em}
  .brand em{font-style:normal;color:var(--accent-ink)}
  .topmeta{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}

  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}

  /* ── 头部（编辑式，替代原渐变 hero）── */
  .hero{padding:26px 0 18px}
  .eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-ink);margin-bottom:10px}
  h1 .zh{display:block;font-size:19px;font-weight:600}
  .lede{color:var(--muted);font-size:14.5px;line-height:1.7;margin-top:8px}

  /* 统计：hairline 横条 */
  .stats{display:flex;border-block:1px solid var(--border);margin-top:16px}
  .cell{flex:1;padding:10px 8px 9px;text-align:start}
  .cell + .cell{border-inline-start:1px solid var(--border)}
  .num{font-family:var(--mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
  .num span{color:var(--accent-ink)}
  .label{font-size:11px;color:var(--muted);margin-top:1px}

  /* ── 搜索与分类 ── */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:30px 0 6px}
  .search{flex:1 1 260px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:9px 13px}
  .search svg{flex:none;color:var(--muted)}
  .search input{flex:1;border:0;outline:0;background:transparent;font-size:14px;font-family:inherit;color:var(--ink)}
  .search input::placeholder{color:var(--muted)}
  .cats{display:flex;flex-wrap:wrap;gap:7px}
  .cat{cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:6px 13px;border-radius:3px;font-size:12.5px;font-family:var(--mono);transition:border-color .15s,color .15s,background .15s;user-select:none}
  .cat:hover{border-color:var(--accent);color:var(--accent-ink)}
  .cat.active{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ── 卡片：直角 + hairline，去阴影去位移 ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:20px;margin:24px 0 64px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:3px;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:border-color .18s}
  .card:hover{border-color:var(--muted)}
  .card .thumb{height:118px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--code)!important;border-bottom:1px solid var(--border)}
  .card .thumb .glyph{font-size:36px;filter:none}
  .card .thumb .cat-tag{position:absolute;top:10px;left:10px;background:var(--surface);border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:2px 8px;font-weight:500}
  .card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card .body h3{font-size:15.5px;font-weight:600;line-height:1.5}
  .card .body h3 a:hover{color:var(--accent-ink)}
  .card .body .desc{font-size:13px;color:var(--muted);flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .tags{display:flex;flex-wrap:wrap;gap:5px}
  .card .tags .t{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--code);border:1px solid var(--border);border-radius:3px;padding:1px 7px}
  .card .foot{display:flex;align-items:center;justify-content:space-between;padding-top:11px;border-top:1px solid var(--border)}
  .card .foot .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .card .foot .open{font-size:13px;color:var(--accent-ink);font-weight:600;display:flex;align-items:center;gap:5px}
  .card .foot .open svg{transition:transform .18s}
  .card:hover .foot .open svg{transform:translateX(3px)}

  .empty{grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--muted);border:1px dashed var(--border)}
  .empty .big{font-size:34px;margin-bottom:8px;opacity:.6}

  /* ── 左侧固定悬浮标签卡 ── */
  .tag-float{position:fixed;left:20px;top:96px;z-index:40;width:186px;background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:11px 13px}
  .tag-float summary{list-style:none;cursor:pointer;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
  .tag-float summary::-webkit-details-marker{display:none}
  .tag-float summary::after{content:"+";float:right;font-family:var(--mono)}
  .tag-float[open] summary::after{content:"–"}
  .tag-float[open]{max-height:calc(100vh - 130px);overflow-y:auto}
  .tag-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .tag-chip{cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--code);border:1px solid var(--border);border-radius:3px;padding:2px 8px;transition:border-color .15s,color .15s;user-select:none}
  .tag-chip:hover{border-color:var(--accent);color:var(--accent-ink)}
  .tag-chip .n{color:var(--accent-ink)}
  @media (max-width:1399px){
    .tag-float{left:14px;top:auto;bottom:16px;box-shadow:0 8px 28px rgba(28,27,26,.14)}
  }

  /* ── 页脚 ── */
  footer{border-top:1px solid var(--border);background:var(--surface);padding:26px 24px;text-align:center;color:var(--muted);font-size:12.5px;font-family:var(--mono);letter-spacing:.03em}
  footer a{color:var(--ink)}
  footer a:hover{color:var(--accent-ink)}
  footer .gh{display:inline-flex;align-items:center;gap:6px;margin-top:8px}

  @media (max-width:640px){
    .stats{flex-wrap:wrap}
    .cell{flex:1 1 44%}
    .cell:nth-child(3){border-inline-start:0;border-top:1px solid var(--border)}
    .cell:nth-child(4){border-top:1px solid var(--border)}
    .toolbar{flex-direction:column;align-items:stretch}
    .hero{padding:18px 0 14px}
  }

  /* 卡片：去 glyph 后的分类标签（移入卡体） */
  .card .body .cat-tag{
    display:inline-flex;align-self:flex-start;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
    color:var(--muted);background:var(--code);border:1px solid var(--border);
    border-radius:3px;padding:2px 8px;
  }
  /* 顶栏个人网站入口（DAILY DROPS 左侧） */
  .topbar-side{display:inline-flex;align-items:center;gap:12px}
  .site-entry{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--accent-ink);text-decoration:none;border:1px solid var(--border);border-radius:3px;padding:4px 10px;background:var(--surface);transition:color .15s,border-color .15s}
  .site-entry:hover{color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>
<body>

<header class="topbar">

  <div class="toolbar">

<script>
// ============================================================
// 子网页登记表：每新增一个页面，只需在下面数组里加一条记录
// ============================================================
const PAGES = [
  {
    title: "SKILL 介绍 · Agent Skills 概念手册",
    desc: "Agent Skill 概念手册（33 节）：是什么、为什么出现、与 Prompt / Tool / MCP / Workflow / Agent 的区别、渐进式披露、生产级七层、架构位置与生命周期，附官方来源。",
    url: "skill.html",
    date: "2026-09-09",
    category: "效率工具",
    tags: ["Skill", "Agent", "概念手册", "AI"],
    gradient: "linear-gradient(135deg,#c96442,#8a3b1f)",
    glyph: "🧩"
  },
  {
    title: "生产级 Agent Skill 架构规范",
    desc: "Skill 工程层规范（35 节）：标准模型 14 模块、目录结构与渐进披露、Contract / Schema、Decision Rules、Validation / Evaluation、Registry / Router / Runtime、依赖组合、生命周期与 Capability OS。",
    url: "skill-spec.html",
    date: "2026-09-09",
    category: "效率工具",
    tags: ["Skill", "架构规范", "Agent", "Capability OS"],
    gradient: "linear-gradient(135deg,#8a3b1f,#4a2413)",
    glyph: "📐"
  },
  {
    title: "如何制作适合自己的 Skill",
    desc: "七步法实操指南（13 节）：选高频任务、挖隐性方法、立判断规则、五部分目录、输入输出契约、真实案例训练、自评闭环，以及个人 Skill 工厂与三个母 Skill。",
    url: "skill-diy.html",
    date: "2026-09-09",
    category: "效率工具",
    tags: ["Skill", "实操指南", "七步法", "AI"],
    gradient: "linear-gradient(135deg,#b45a2e,#7a3315)",
    glyph: "🛠️"
  },
  {
    title: "AI Agent 提效培训 · WorkBuddy 专题",
    desc: "面向食品生产企业的 AI Agent 培训课件（浅色商务风）：概念科普、Markdown/GitHub 技术预备、主流智能体盘点、七大业务场景实战、Typora 可视化交付与 Skill 方法论。",
    url: "ai-agent-training.html",
    date: "2026-09-08",
    category: "效率工具",
    tags: ["AI Agent", "WorkBuddy", "培训", "产品部"],
    gradient: "linear-gradient(135deg,#2b5cff,#8b7bff)",
    glyph: "🤖"
  },
  {
    title: "超强厄尔尼诺 · 2027年全维度影响分析",
    desc: "一次史无前例的超强厄尔尼诺（峰值或超 +3℃，冲有观测记录以来最强），从气候、粮食、能源、生态、健康、金融、基建到青海/西北本土视角的 14 维系统性研判。",
    url: "el-nino-2027-impact.html",
    date: "2026-09-08",
    category: "金融分析",
    tags: ["厄尔尼诺", "气候", "2027", "粮食安全", "能源"],
    gradient: "linear-gradient(135deg,#0b5d8a,#e0522f)",
    glyph: "🌏"
  },
  {
    title: "Prompt 库",
    desc: "个人 Prompt 收藏管理器，支持搜索、分类、标签、收藏、一键复制、Ctrl+K 快捷搜索，数据存 GitHub 可追溯。",
    url: "prompt.html",

    category: "效率工具",
    tags: ["Prompt", "收藏", "效率"],
    gradient: "linear-gradient(135deg,#0ea5e9,#22c55e)",
    glyph: "⚡"
  },
   {
    title: "地平线 · 个人博客",
    desc: "个人博客「地平线」独立站（eastseao/horizon，Jekyll 构建）：影评、随笔与生活记录，共 60+ 页面。",
    url: "https://eastseao.github.io/horizon/",
    date: "2025-11-09",
    category: "个人博客",
    tags: ["博客", "地平线", "Jekyll"],
    gradient: "linear-gradient(135deg,#1c1b1a,#8a3b1f)",
    glyph: "🌅"
  }
];

const CAT_COLORS = {
  "金融分析": "linear-gradient(135deg,#2f5cff,#00b4d8)"
};

function render() {
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const activeCat = document.querySelector('.cat.active');
  const cat = activeCat ? activeCat.dataset.cat : '全部';

  const cats = ['全部', ...Array.from(new Set(PAGES.map(p => p.category)))];
  const catBox = document.getElementById('cats');
  catBox.innerHTML = cats.map(c =>
    `<div class="cat${c === cat ? ' active' : ''}" data-cat="${c}">${c}</div>`
  ).join('');
  catBox.querySelectorAll('.cat').forEach(el => el.addEventListener('click', () => {
    catBox.querySelectorAll('.cat').forEach(x => x.classList.remove('active'));
    el.classList.add('active'); render();
  }));

  const filtered = PAGES.filter(p => {
    const okCat = cat === '全部' || p.category === cat;
    const hay = (p.title + ' ' + p.desc + ' ' + p.tags.join(' ') + ' ' + p.category).toLowerCase();
    const okQ = !q || hay.includes(q);
    return okCat && okQ;
  }).sort((a, b) => b.date.localeCompare(a.date));

  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty"><div class="big">🔍</div>没有找到匹配的页面，换个关键词试试</div>`;
  } else {
    grid.innerHTML = filtered.map(p => `
      <article class="card">
        <div class="body">
          <span class="cat-tag">${p.category}</span>
          <h3><a href="${p.url}">${p.title}</a></h3>
          <div class="desc">${p.desc}</div>
          <div class="tags">${p.tags.map(t => `<span class="t"># ${t}</span>`).join('')}</div>
          <div class="foot">
            <span class="meta">📅 ${p.date}</span>
            <a class="open" href="${p.url}">阅读全文
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          </div>
        </div>
      </article>
    `).join('');
  }

  // stats
  document.getElementById('statPages').innerHTML = `<span>${PAGES.length}</span>`;
  document.getElementById('statCats').innerHTML = `<span>${new Set(PAGES.map(p => p.category)).size}</span>`;
  document.getElementById('statTags').innerHTML = `<span>${new Set(PAGES.flatMap(p => p.tags)).size}</span>`;
  const latest = PAGES.map(p => p.date).sort().pop();
  document.getElementById('statLatest').textContent = latest ? latest.slice(5).replace('-', '.') : '—';
}

document.getElementById('q').addEventListener('input', render);
render();

</script>

<details class="tag-float" id="tagFloat">
  <summary>标签 · Tags</summary>
  <div class="tag-list" id="tagList"></div>
</details>

<script>
(function(){
  var counts = {};
  PAGES.forEach(function(p){ (p.tags||[]).forEach(function(t){ counts[t] = (counts[t]||0)+1; }); });
  var tags = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a] || a.localeCompare(b,'zh'); });
  document.getElementById('tagList').innerHTML = tags.map(function(t){
    return '<span class="tag-chip" data-tag="' + t + '" title="点击按标签筛选">' + t + ' <span class="n">' + counts[t] + '</span></span>';
  }).join('');
  document.getElementById('tagList').addEventListener('click', function(e){
    var chip = e.target.closest('.tag-chip'); if (!chip) return;
    var q = document.getElementById('q');
    q.value = (q.value === chip.getAttribute('data-tag')) ? '' : chip.getAttribute('data-tag');
    q.dispatchEvent(new Event('input'));
  });
  var mq = window.matchMedia('(min-width:1400px)');
  var sync = function(){ document.getElementById('tagFloat').open = mq.matches; };
  if (mq.addEventListener) { mq.addEventListener('change', sync); } else { mq.addListener(sync); }
  sync();
})();
</script>
