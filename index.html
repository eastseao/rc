<style>
@font-face{font-family:"Work Sans";font-style:normal;font-weight:300 600;font-display:swap;src:url("assets/fonts/worksans-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215;}
@font-face{font-family:"Work Sans";font-style:normal;font-weight:300 600;font-display:swap;src:url("assets/fonts/worksans-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+1E00-1E9F;}

:root{
  --ground:#e6e1d6; --ground-2:#dbd5c6; --ground-3:#cfc8b5;
  --ink:#1b1917; --ink-2:#413c34; --ink-3:#5f5849;
  --on-ink:#efeee9; --on-ink-2:#b0a896;
  --accent:#a16207; --accent-ink:#7a4a05;
  --fs-display:clamp(64px,14vw,200px);
  --fs-h:clamp(26px,2.4vw,34px);
  --fs-row:clamp(17px,1.3vw,20px);
  --fs-body:16px;
  --pad:clamp(20px,5vw,64px);
  --w:980px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);overflow-x:hidden;font-family:"Work Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
h1,h2,p,ol,li{margin:0}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ══ 固定题名层 ══════════════════════════════════ */
.stage{position:relative}
.pin{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:11svh;z-index:3}
.pin nav{position:absolute;top:30px;left:0;right:0;display:flex;justify-content:space-between;align-items:baseline;padding:0 var(--pad);font-size:16px}
.pin nav a{color:var(--ink-2);transition:color .16s var(--ease)}
.pin nav a:hover{color:var(--accent-ink)}
.pin h1{margin:0;font-size:var(--fs-display);line-height:.88;letter-spacing:-.04em;font-weight:600}
.pin .sub{max-width:32ch;margin:30px auto 0;font-size:clamp(16px,1.4vw,19px);color:var(--ink-2);line-height:1.45}
.pin .facts{display:flex;gap:30px;margin:24px auto 0;font-size:clamp(15px,1.3vw,18px);color:var(--ink-3);font-variant-numeric:tabular-nums}
.pin .cta-btn{display:inline-block;margin:32px auto 0;background:var(--ink);color:var(--ground);padding:15px 28px;font-size:17px;transition:background .18s var(--ease),transform .18s var(--ease)}
.pin .cta-btn:hover{background:var(--accent);transform:translateY(-2px)}
.pin .hint{margin-top:auto;margin-bottom:5svh;font-size:15px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pin .hint span{display:inline-block;animation:nudge 1.8s var(--ease) infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* ══ hero 肌理背景：28 张真实截图组成的淡马赛克 ══════════ */
.pin-bg{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.pin-bg .mz{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;opacity:.34}
.pin-bg .mz img{width:100%;height:100%;object-fit:cover;filter:grayscale(.25) brightness(1.12) contrast(.9) saturate(.7)}
.pin-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 42%,rgba(230,225,214,.94) 0%,rgba(230,225,214,.64) 55%,rgba(230,225,214,.42) 100%)} /* taste-skill-ignore: neutral scrim over the photo mosaic, keeps the title legible */

/* ══ 九类索引 ══════════════════════════════════ */
.cats{max-width:var(--w);margin:0 auto;padding:10svh var(--pad) 4svh}
.cats h2{font-size:var(--fs-h);font-weight:600;letter-spacing:-.02em;margin-bottom:22px}
.cats .row{display:flex;flex-wrap:wrap;gap:12px}
.cat{display:inline-flex;align-items:baseline;gap:8px;background:var(--ground-3);padding:12px 16px;font-size:var(--fs-row);color:var(--ink);transition:background .16s var(--ease),color .16s var(--ease)}
.cat:hover{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.cat .n{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cat:hover .n{color:var(--on-ink-2)}

/* ══ 作品封面卷轴 ══════════════════════════════════ */
.reel{padding:0 var(--pad) 6svh;position:relative;z-index:1}
.reel-h{max-width:var(--w);margin:8svh auto 5svh;font-size:var(--fs-h);font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.plate{margin:0 auto 12svh;max-width:var(--w)}
.plate:first-child{margin-top:0}
.plate-link{display:block;position:relative}
.shot{display:block;aspect-ratio:16/10;background:var(--ground-2);overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top left;transform:scale(1.001);transition:transform .6s var(--ease)}
.plate-link:hover .shot img,.plate-link:focus-visible .shot img{transform:scale(1.04)}
.cover{display:none}
.plate-link.noimg .shot{background:var(--ink)}
.plate-link.noimg img{display:none}
.plate-link.noimg .cover{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;padding:8% 10%;text-align:center;color:var(--on-ink);font-size:clamp(20px,2.4vw,34px);line-height:1.15;letter-spacing:-.01em;font-weight:500}
.cap{display:flex;justify-content:space-between;gap:20px;align-items:baseline;margin-top:16px;font-size:var(--fs-row)}
.cap b{font-weight:500;color:var(--ink);max-width:36ch}
.cap .m{color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ══ 深色收尾 ══════════════════════════════════ */
.close{background:var(--ink);color:var(--on-ink);padding:18svh var(--pad);text-align:center}
.close p{font-size:clamp(26px,4vw,52px);font-weight:600;letter-spacing:-.02em;line-height:1.08;max-width:16ch;margin:0 auto 32px}
.close a{display:inline-block;background:var(--accent);color:#fff;padding:16px 30px;font-size:18px;transition:background .18s var(--ease),transform .18s var(--ease)}
.close a:hover{background:#b8740a;transform:translateY(-2px)}
.foot{padding:40px var(--pad) 44px;font-size:16px;color:var(--ink-3);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.foot .name{color:var(--ink);letter-spacing:.04em}

/* ══ 入场 ══════════════════════════════════ */
.js .plate-link{opacity:0;transform:translateY(24px)}
.js .plate-link.in{opacity:1;transform:none;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.js .close,.js .foot{opacity:0;transform:translateY(24px)}
.js .close.in,.js .foot.in{opacity:1;transform:none;transition:opacity .6s var(--ease),transform .6s var(--ease)}

@media(max-width:760px){
  .pin{padding-top:16svh}
  .pin .sub{margin-top:22px}
  .plate{margin-bottom:9svh}
  .plate:first-child{margin-top:4svh}
  .cap{flex-direction:column;gap:4px}
  .cap .m{white-space:normal}
  .cats{padding:8svh var(--pad) 3svh}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .pin .hint span{animation:none}
  .js .plate-link,.js .close,.js .foot{opacity:1;transform:none}
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
<script>document.documentElement.className='js';</script>
</head>

<script src="manifest.js"></script>
<script>
(function(){
  'use strict';
  var esc = function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
  var slugOf = function(u){return (u||'').replace(/^pages\//,'').replace(/^tools\//,'').replace(/\/index\.html$/,'').replace(/\.html$/,'');};
  var reel = document.getElementById('reel');
  var W = window.WORKS;

  // hero 肌理背景：28 张真实截图组成的淡马赛克
  (function(){
    var MOSAIC = ["ai-agent-training","ai-daily-2026-09-16","ai-presenter-video-workflow","cat-breeds-2026","china-fruit-varieties-2026","chinese-ceramics-5000y-history","ebook-treasure-chest","first-principles-2026","foreign-trade-order-lifecycle-2026","how-to-live-better-2026","ico-converter","lottery-rules-2026","markitdown","methodology-atlas","miniprogram-dev-flow-2026","nitrogen-flush-pack-2026","programming-languages-2026","prompt-visualization-2026","prompt","purchasing-order-flow-2025","rock-types-2026","sams-onboarding-sop-2026","skill-diy","skill-spec","skill","style-guide","translation-notes-2026","video-downloader"];
    var bg = document.querySelector('.pin-bg');
    if (!bg) return;
    var mz = document.createElement('div'); mz.className = 'mz';
    MOSAIC.forEach(function(s){
      var i = document.createElement('img');
      i.src = 'assets/works/' + s + '.jpg';
      i.alt = ''; i.setAttribute('aria-hidden','true');
      i.loading = 'eager'; i.decoding = 'async';
      mz.appendChild(i);
    });
    bg.appendChild(mz);
  })();

  if (!Array.isArray(W)) {
    reel.insertAdjacentHTML('afterbegin','<p style="font-size:20px;padding:40px 0">作品数据未能加载，请刷新页面。</p>');
    return;
  }
  var sorted = W.filter(function(x){return x.d&&x.t;}).sort(function(a,b){return String(b.d).localeCompare(String(a.d));});
  var top = sorted.slice(0,14);
  top.forEach(function(w){
    var slug = slugOf(w.u);
    var a = document.createElement('a');
    a.className = 'plate-link';
    a.href = w.u;
    a.setAttribute('data-rv','');
    a.innerHTML = '<span class="shot"><img src="assets/works/'+slug+'.jpg" alt="'+esc(w.t)+' 页面截图" loading="lazy" onerror="this.closest(\'.plate-link\').classList.add(\'noimg\')"><span class="cover">'+esc(w.t)+'</span></span>'
      + '<span class="cap"><b>'+esc(w.t)+'</b><span class="m">'+esc(w.c)+' · '+esc(w.d)+'</span></span>';
    var plate = document.createElement('article');
    plate.className = 'plate';
    plate.appendChild(a);
    reel.appendChild(plate);
  });

  // 九类索引：按 manifest 统计每类数量
  (function(){
    var counts = {};
    W.forEach(function(x){ if (x.c) counts[x.c] = (counts[x.c] || 0) + 1; });
    [].slice.call(document.querySelectorAll('.cat')).forEach(function(a){
      var n = a.querySelector('.n');
      if (n) n.textContent = counts[a.getAttribute('data-cat')] || 0;
    });
  })();

  var els = [].slice.call(document.querySelectorAll('[data-rv]'));
  if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    els.forEach(function(el){ el.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin:'0px 0px -8% 0px', threshold:0.05 });
  els.forEach(function(el){ io.observe(el); });
  setTimeout(function(){ els.forEach(function(el){ el.classList.add('in'); }); }, 1600);
})();
</script>
