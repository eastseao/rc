<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常 · Agent 作品集</title>
<meta name="description" content="日常 Agent 产出的网页合集 —— 行业研究 / 效率工具 / 金融分析 / 生活，一份持续更新的个人工作记录。全部页面开源、数据可复现。">
<!--
  v4 首页改版（2026-09-20）
  视觉：全站统一主题（theme.css）—— 墨黑顶栏 + 青 accent + 雾面分带 + 圆角卡片 + 超大写水印
  结构：hero → 分类工具条(sticky，与内容紧邻) → 精选大卡(参与筛选) → 卡片网格 → 站点页脚
  数据：PAGES 登记表为唯一数据源；新增一条即自动进入列表、统计、分类导航与页脚「最近更新」
  注意：页面位于域名根，站内链接不带 /rc/ 前缀
-->
<link rel="stylesheet" href="theme.css">
<style>
  /* 首页专属变量：深色精选卡与版心（其余 token 一律来自 theme.css） */
  :root{
    --border-2:#c3ceda;
    --dark:#0f172a; --dark-2:#1b2942; --dark-ink:#f1f5f9; --dark-muted:#94a3b8;
    --maxw:1120px;
    --bar-h:52px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  .mono{font-family:var(--mono)}

  /* ── 1. 顶栏（墨黑） ───────────────────── */
  .topbar{position:sticky;top:0;z-index:50;background:var(--dark);color:#e9e9ec;padding:0 24px}
  .topbar-in{max-width:var(--maxw);margin:0 auto;height:var(--bar-h);display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:baseline;gap:11px;min-width:0}
  .brand .b-en{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.16em;color:#fff}
  .brand .b-zh{font-size:12.5px;color:#8f8f96;letter-spacing:.02em;white-space:nowrap}
  .nav{margin-inline-start:auto;display:flex;align-items:center;gap:2px}
  .nav a{padding:6px 11px;border-radius:6px;font-size:13.5px;color:#c9c9cf;transition:color .15s,background .15s;white-space:nowrap}
  .nav a:hover{color:#fff;background:rgba(255,255,255,.09)}
  .nav a.on{color:#fff;font-weight:600;background:rgba(13,148,136,.28)}
  .nav a .cnt{font-family:var(--mono);font-size:11px;color:#8f8f96;margin-inline-start:5px}
  .nav a.on .cnt{color:#5eead4}
  .searchbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;margin-inline-start:6px;border-radius:6px;color:#c9c9cf;transition:color .15s,background .15s}
  .searchbtn:hover{color:#fff;background:rgba(255,255,255,.09)}

  /* ── 2. Hero ──────────────────────────── */
  .hero{text-align:center;padding:68px 0 46px}
  .pill-tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);background:var(--band);border-radius:999px;padding:5px 14px}
  .pill-tag i{width:5px;height:5px;border-radius:50%;background:var(--accent);font-style:normal}
  h1.hero-title{font-size:clamp(30px,4.6vw,50px);font-weight:700;letter-spacing:-.022em;line-height:1.18;margin:20px 0 14px}
  h1.hero-title .dot{color:var(--border-2);font-weight:400;margin:0 .1em}
  .hero-lede{color:var(--muted);font-size:15.5px;line-height:1.7;max-width:620px;margin:0 auto}
  .cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:28px 0 24px}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:11px 26px;font-size:14px;font-weight:600;transition:.16s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-ink)}
  .btn-ghost{border:1px solid var(--border-2);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--ink);background:var(--band)}
  .hero-stats{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 10px;font-family:var(--mono);font-size:12px;color:var(--muted-2);letter-spacing:.03em}
  .hero-stats b{color:var(--ink);font-weight:700}
  .hero-stats .sep{color:var(--border-2)}

  /* ── 3. 分类工具条（sticky，与内容紧邻） ── */
  .toolbar{position:sticky;top:var(--bar-h);z-index:45;background:var(--band);border-block:1px solid var(--line);
    scroll-margin-top:var(--bar-h)}
  .toolbar-in{max-width:var(--maxw);margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  .toolbar h2{font-size:18px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
  .toolbar h2 span{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--muted-2)}
  .chips{margin-inline-start:auto;display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--border-2);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink);background:var(--surface);transition:.15s;white-space:nowrap}
  .chip:hover{border-color:var(--ink)}
  .chip.on{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:600}
  .chip .cnt{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-inline-start:5px}
  .chip.on .cnt{color:#5eead4}

  /* ── 4. 精选深色大卡 ──────────────────── */
  .feature{background:var(--dark);color:var(--dark-ink)}
  .feature[hidden]{display:none}
  .feature-in{max-width:var(--maxw);margin:0 auto;padding:44px 24px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:44px;align-items:center}
  .feat-tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.07em;color:var(--dark-muted);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 13px}
  .feat-tag b{color:#fff;font-weight:600}
  .feature h2{font-size:clamp(24px,3vw,33px);font-weight:700;letter-spacing:-.02em;line-height:1.28;margin:18px 0 14px;color:#fff}
  .feature p{color:var(--dark-muted);font-size:14.5px;line-height:1.72}
  .feat-meta{font-family:var(--mono);font-size:12px;color:#7c7c82;letter-spacing:.03em;margin:16px 0 22px}
  .feat-cta{display:flex;flex-wrap:wrap;align-items:center;gap:20px}
  .link-arrow{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent)}
  .feature .link-arrow{color:#5eead4}
  .link-arrow svg{transition:transform .18s}
  .link-arrow:hover svg{transform:translateX(3px)}
  .feat-shot{display:block;border-radius:10px;overflow:hidden;background:#101012;border:1px solid rgba(255,255,255,.1)}
  .feat-shot img{display:block;width:100%;height:auto}

  /* ── 5. 卡片网格 ──────────────────────── */
  .sec{padding:34px 0 0}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .18s,box-shadow .18s}
  .card:hover{border-color:var(--border-2);box-shadow:var(--shadow)}
  .card .body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
  .card .crow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .card .cat{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--accent-ink)}
  .card .date{font-family:var(--mono);font-size:11.5px;color:var(--muted-2)}
  .card h3{font-size:16.5px;font-weight:600;letter-spacing:-.012em;line-height:1.5}
  .card h3 a:hover{color:var(--accent-ink)}
  .card .desc{font-size:13.5px;color:var(--muted);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .card .tags .t{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--band);border-radius:999px;padding:3px 10px}
  .card .tags .k{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--accent-ink);
    background:var(--accent-soft);border-radius:4px;padding:3px 7px}
  .card .foot{margin-top:auto;padding-top:14px}
  .card.personal{background:var(--band);border-color:transparent}
  .card.personal .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted-2)}
  .card.personal h3{font-size:19px}
  .card.personal .chip-mini{display:inline-block;font-size:12.5px;color:var(--muted);border:1px solid var(--border-2);background:var(--surface);border-radius:999px;padding:4px 12px}

  .empty{grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--muted);border:1px dashed var(--border-2);border-radius:12px}
  .empty .big{font-size:32px;margin-bottom:8px;opacity:.55}

  /* ── 6. 站点页脚 ──────────────────────── */
  .footer{background:var(--band);border-top:1px solid var(--line)}
  .footer-in{max-width:var(--maxw);margin:0 auto;padding:52px 24px 40px;display:grid;grid-template-columns:1.6fr 1fr 1.2fr 1fr;gap:36px}
  .fcol h4{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--ink);margin-bottom:14px}
  .fcol .fbrand{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.16em;margin-bottom:12px}
  .fcol p{font-size:13.5px;color:var(--muted);line-height:1.75;max-width:320px}
  .fcol a{display:block;font-size:13.5px;color:var(--muted);padding:3px 0}
  .fcol a:hover{color:var(--accent-ink)}
  .fcol a .recent-d{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-inline-start:6px}
  .watermark{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  .watermark span{display:block;font-family:var(--mono);font-weight:700;letter-spacing:.005em;
    font-size:clamp(38px,7.4vw,84px);line-height:1;color:#dfe6ef;white-space:nowrap;user-select:none}
  .legal{max-width:var(--maxw);margin:0 auto;padding:20px 24px 28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;
    font-family:var(--mono);font-size:11.5px;color:var(--muted-2)}

  /* ── 7. 响应式 ────────────────────────── */
  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .feature-in{grid-template-columns:1fr;gap:26px}
    .feat-shot{order:-1}
    .footer-in{grid-template-columns:1fr 1fr;gap:28px}
  }
  @media (max-width:640px){
    body{font-size:14.5px}
    .topbar{padding:0 16px}
    .topbar-in{height:48px;gap:8px}
    :root{--bar-h:48px}
    .brand .b-zh{display:none}
    .nav a{padding:6px 8px;font-size:12.5px}
    .nav a .cnt{display:none}
    .wrap,.toolbar-in,.feature-in,.footer-in,.watermark,.legal{padding-inline:16px}
    .hero{padding:44px 0 34px}
    h1.hero-title{font-size:clamp(26px,8.4vw,34px)}
    .hero-lede{font-size:14.5px}
    .cta{gap:10px;margin:22px 0 20px}
    .btn{padding:10px 20px;font-size:13.5px}
    .toolbar-in{padding-top:12px;padding-bottom:12px;gap:10px}
    .chips{margin-inline-start:0;width:100%}
    .feature-in{padding-top:32px;padding-bottom:32px}
    .grid{grid-template-columns:1fr;gap:14px;padding-bottom:44px}
    .footer-in{grid-template-columns:1fr;gap:24px;padding-top:38px}
    .legal{padding-bottom:22px}
  }
</style>
</head>

// 顶栏分类导航的固定顺序（其余分类自动追加到末尾）
const CAT_ORDER = ["行业研究", "效率工具", "金融分析", "生活"];

let currentCat = "全部";
let keyword = "";

const ARROW = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function articles(){
  return PAGES.filter(p => !p.personal).slice().sort((a,b) => b.date.localeCompare(a.date));
}
/* 当前筛选结果（分类 + 关键词） */
function filtered(){
  return articles().filter(match);
}
/* 精选条目：只在「当前筛选结果」里找，找不到就不显示精选区
   —— 这样切到某个分类时，精选大卡不会显示别的分类的条目 */
function featured(){
  return filtered().find(x => x.feature) || null;
}
/* 网格条目：当前筛选结果去掉精选那一条 */
function gridItems(){
  const f = featured();
  return filtered().filter(p => p !== f);
}
function categories(){
  const set = [];
  CAT_ORDER.forEach(c => { if (articles().some(p => p.category === c)) set.push(c); });
  articles().forEach(p => { if (p.category && set.indexOf(p.category) < 0) set.push(p.category); });
  return set;
}
function catCount(c){
  return articles().filter(p => p.category === c).length;
}
function match(p){
  const okCat = currentCat === "全部" || p.category === currentCat;
  if (!okCat) return false;
  if (!keyword) return true;
  const hay = (p.title + " " + p.desc + " " + p.tags.join(" ") + " " + p.category + " " + (p.kind || "")).toLowerCase();
  return hay.indexOf(keyword.toLowerCase()) >= 0;
}

/* 顶栏分类导航：点击后滚动到工具条并套用筛选 */
function renderNav(){
  const nav = document.getElementById('catnav');
  nav.innerHTML = ['<a href="#works" data-cat="全部">全部</a>']
    .concat(categories().map(c => `<a href="#works" data-cat="${esc(c)}">${esc(c)}<span class="cnt">${catCount(c)}</span></a>`))
    .join('');
  nav.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => setCat(a.dataset.cat));
  });
  syncNav();
}
function syncNav(){
  document.querySelectorAll('#catnav a').forEach(a => {
    const on = a.dataset.cat === currentCat;
    a.classList.toggle('on', on);
    if (on) { a.setAttribute('aria-current', 'true'); } else { a.removeAttribute('aria-current'); }
  });
}

/* 分类 chips */
function renderChips(){
  const box = document.getElementById('chips');
  const all = ['全部'].concat(categories());
  box.innerHTML = all.map(c =>
    `<button class="chip${c === currentCat ? ' on' : ''}" type="button" data-cat="${esc(c)}">${esc(c)}<span class="cnt">${c === '全部' ? articles().length : catCount(c)}</span></button>`
  ).join('');
  box.querySelectorAll('.chip').forEach(b => {
    b.addEventListener('click', () => setCat(b.dataset.cat));
  });
}
function setCat(cat){
  currentCat = cat;
  renderChips();
  renderNav();
  renderFeature();
  renderGrid();
}

/* 精选深色大卡 */
function renderFeature(){
  const box = document.getElementById('feature');
  const p = featured();
  if (!p) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  const shot = p.image
    ? `<a class="feat-shot" href="${p.url}" aria-label="${esc(p.title)}"><img src="${p.image}" alt="${esc(p.imageAlt || p.title)}" loading="lazy" width="1344" height="816"></a>`
    : `<a class="feat-shot" href="${p.url}" aria-label="${esc(p.title)}"></a>`;
  box.innerHTML = `
    <div class="feature-in">
      <div>
        <span class="feat-tag"><b>精选</b> · ${esc(p.category)}${p.kind ? ' · ' + esc(p.kind) : ''}</span>
        <h2>${p.title}</h2>
        <p>${esc(p.desc)}</p>
        <div class="feat-meta">${esc(p.date)} · ${p.tags.slice(0,2).map(esc).join(' / ')}</div>
        <div class="feat-cta">
          <a class="btn btn-primary" href="${p.url}">阅读全文</a>
          <a class="link-arrow" href="${p.url}">查看数据表 ${ARROW}</a>
        </div>
      </div>
      ${shot}
    </div>`;
}

/* 卡片网格 */
function renderGrid(){
  const grid = document.getElementById('grid');
  const list = gridItems();
  const personal = PAGES.filter(p => p.personal);

  let html = list.map(p => `
    <article class="card">
      <div class="body">
        <div class="crow"><span class="cat">${esc(p.category)}</span><span class="date">${esc(p.date)}</span></div>
        <h3><a href="${p.url}">${esc(p.title)}</a></h3>
        <div class="desc">${esc(p.desc)}</div>
        <div class="tags">${p.kind ? `<span class="k">${esc(p.kind)}</span>` : ''}${p.tags.slice(0,3).map(t => `<span class="t"># ${esc(t)}</span>`).join('')}</div>
        <div class="foot"><a class="link-arrow" href="${p.url}">阅读全文 ${ARROW}</a></div>
      </div>
    </article>`).join('');

  // 「关于」卡仅在「全部 + 无搜索」时出现在网格末位
  if (currentCat === "全部" && !keyword) {
    html += personal.map(p => `
      <article class="card personal" id="about">
        <div class="body">
          <span class="kicker">${esc(p.kicker)}</span>
          <h3>${esc(p.title)}</h3>
          <div class="desc">${esc(p.desc)}</div>
          <div class="tags">${p.tags.map(t => `<span class="chip-mini">${esc(t)}</span>`).join('')}</div>
          <div class="foot"><a class="link-arrow" href="${p.url}" target="_blank" rel="noopener">${esc(p.cta)} ${ARROW}</a></div>
        </div>
      </article>`).join('');
  }

  grid.innerHTML = html || `<div class="empty"><div class="big">📭</div>没有匹配的作品${keyword ? `：<b>${esc(keyword)}</b>` : ''}</div>`;
  // 计数 = 当前筛选结果（含精选那条）
  document.getElementById('list-count').textContent = filtered().length;
}

/* 页脚「内容」栏：跟随分类自动生成，点击即筛选 */
function renderFooterCats(){
  const box = document.getElementById('f-cat');
  box.innerHTML = '<h4>内容</h4>' + categories().map(c =>
    `<a href="#works" data-cat="${esc(c)}">${esc(c)}<span class="recent-d">${catCount(c)}</span></a>`).join('');
  box.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => setCat(a.dataset.cat));
  });
}

/* 页脚「最近更新」栏：从登记表自动派生，不再硬编码 */
function renderFooterRecent(){
  const box = document.getElementById('f-recent');
  const top = articles().slice(0, 4);
  box.innerHTML = '<h4>最近更新</h4>' + top.map(p =>
    `<a href="${p.url}" title="${esc(p.title)}">${esc(p.title.length > 16 ? p.title.slice(0, 16) + '…' : p.title)}<span class="recent-d">${esc(p.date.slice(5))}</span></a>`
  ).join('');
}

/* Hero 统计 */
function renderStats(){
  document.getElementById('stat-pages').textContent = articles().length;
  document.getElementById('stat-cats').textContent = categories().length;
}

/* 顶栏搜索：就地弹出输入框，实时过滤网格 */
function initSearch(){
  const btn = document.getElementById('searchbtn');
  let panel = null;
  btn.addEventListener('click', () => {
    if (panel) { close(); return; }
    panel = document.createElement('div');
    panel.style.cssText = 'position:fixed;inset-inline:0;top:var(--bar-h);z-index:49;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:center';
    panel.innerHTML = '<div style="max-width:1120px;width:100%;display:flex;align-items:center;gap:10px">'
      + '<input id="q" type="search" placeholder="搜索标题、摘要或标签…" style="flex:1;font:inherit;font-size:15px;padding:10px 14px;border:1px solid var(--border-2);border-radius:8px;outline:none;background:var(--surface);color:var(--ink)">'
      + '<button id="qclose" type="button" style="font-size:13px;color:var(--muted);padding:8px">关闭</button></div>';
    document.body.appendChild(panel);
    const input = panel.querySelector('#q');
    input.focus();
    input.addEventListener('input', () => { keyword = input.value.trim(); renderFeature(); renderGrid(); });
    panel.querySelector('#qclose').addEventListener('click', close);
    input.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  });
  function close(){
    if (panel) { panel.remove(); panel = null; }
    keyword = '';
    renderFeature();
    renderGrid();
  }
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); btn.click(); }
  });
}

/* 「关于我」入口：先回到全部态，再滚到关于卡 */
function initAbout(){
  document.querySelectorAll('[href="#about"], [data-about]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      if (currentCat !== "全部" || keyword) { setCat("全部"); }
      const el = document.getElementById('about');
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    });
  });
}

renderStats();
renderNav();
renderChips();
renderFeature();
renderGrid();
renderFooterCats();
renderFooterRecent();
initSearch();
initAbout();
</script>
