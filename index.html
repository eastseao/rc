<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常 · Agent 作品集</title>
<meta name="description" content="日常 Agent 产出的网页合集 —— 金融分析、行业研究、数据报告，持续更新。">
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --ink: #1a1d29;
    --ink-2: #5b6170;
    --ink-3: #9aa0ae;
    --line: #eceef3;
    --brand: #2f5cff;
    --brand-2: #00b4d8;
    --accent: #ff7a45;
    --shadow: 0 1px 2px rgba(20,24,40,.04), 0 8px 24px rgba(20,24,40,.06);
    --shadow-hover: 0 4px 8px rgba(20,24,40,.06), 0 18px 40px rgba(20,24,40,.12);
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* ===== Hero ===== */
  .hero {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #0f1c4d 0%, #1e3fae 45%, #2563eb 78%, #06b6d4 100%);
    color: #fff;
    padding: 72px 24px 96px;
    text-align: center;
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 18% 20%, rgba(255,255,255,.14), transparent 42%),
      radial-gradient(circle at 82% 15%, rgba(255,255,255,.10), transparent 38%),
      radial-gradient(circle at 55% 85%, rgba(255,255,255,.08), transparent 50%);
    pointer-events: none;
  }
  .hero .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.24);
    padding: 6px 14px; border-radius: 999px;
    font-size: 13px; letter-spacing: .5px;
    backdrop-filter: blur(6px);
    margin-bottom: 22px;
  }
  .hero .badge .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #5eead4; box-shadow: 0 0 0 3px rgba(94,234,212,.25);
  }
  .hero h1 {
    font-size: clamp(34px, 6vw, 58px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 18px;
  }
  .hero h1 .grad {
    background: linear-gradient(90deg, #7dd3fc, #a5f3fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p.sub {
    max-width: 640px; margin: 0 auto;
    font-size: 16px; color: rgba(255,255,255,.82);
  }

  /* ===== Stats ===== */
  .stats {
    position: relative;
    max-width: 1080px; margin: -48px auto 0;
    padding: 0 24px;
  }
  .stats .row {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 22px 8px;
  }
  .stats .cell { text-align: center; position: relative; }
  .stats .cell + .cell::before {
    content: ""; position: absolute; left: 0; top: 20%; bottom: 20%;
    width: 1px; background: var(--line);
  }
  .stats .num { font-size: 30px; font-weight: 800; color: var(--ink); }
  .stats .num span { color: var(--brand); }
  .stats .label { font-size: 13px; color: var(--ink-2); margin-top: 2px; }

  /* ===== Toolbar ===== */
  .toolbar {
    max-width: 1080px; margin: 36px auto 0; padding: 0 24px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    justify-content: space-between;
  }
  .search {
    flex: 1 1 280px; display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 16px;
    box-shadow: var(--shadow);
  }
  .search svg { flex: none; color: var(--ink-3); }
  .search input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--ink);
  }
  .search input::placeholder { color: var(--ink-3); }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat {
    cursor: pointer; border: 1px solid var(--line); background: var(--card);
    color: var(--ink-2); padding: 8px 16px; border-radius: 999px;
    font-size: 14px; transition: all .18s ease; box-shadow: var(--shadow);
  }
  .cat:hover { border-color: var(--brand); color: var(--brand); }
  .cat.active {
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff; border-color: transparent;
  }

  /* ===== Grid ===== */
  .grid-wrap { max-width: 1080px; margin: 28px auto 60px; padding: 0 24px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
    gap: 22px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow); transition: transform .22s ease, box-shadow .22s ease;
    display: flex; flex-direction: column; position: relative;
  }
  .card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); }
  .card .thumb {
    height: 128px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .card .thumb .glyph { font-size: 44px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.25)); }
  .card .thumb .cat-tag {
    position: absolute; top: 12px; left: 12px;
    background: rgba(255,255,255,.9); color: var(--ink);
    font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 600;
  }
  .card .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card .body h3 { font-size: 17px; font-weight: 700; line-height: 1.4; }
  .card .body h3 a:hover { color: var(--brand); }
  .card .body .desc {
    font-size: 13.5px; color: var(--ink-2); flex: 1;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .meta { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); }
  .card .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .card .tags .t {
    font-size: 12px; color: var(--brand); background: rgba(47,92,255,.08);
    padding: 3px 9px; border-radius: 6px;
  }
  .card .foot {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 12px; border-top: 1px solid var(--line);
  }
  .card .foot .open { font-size: 13.5px; color: var(--brand); font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .card .foot .open svg { transition: transform .18s ease; }
  .card:hover .foot .open svg { transform: translateX(3px); }

  .empty {
    grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--ink-3);
  }
  .empty .big { font-size: 40px; margin-bottom: 8px; }

  /* ===== Footer ===== */
  footer {
    border-top: 1px solid var(--line); background: var(--card);
    padding: 30px 24px; text-align: center; color: var(--ink-3); font-size: 13px;
  }
  footer a { color: var(--brand); }
  footer .gh { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; }

  @media (max-width: 640px) {
    .stats .row { grid-template-columns: repeat(2, 1fr); row-gap: 16px; }
    .stats .cell:nth-child(3)::before { display: none; }
    .toolbar { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="badge"><span class="dot"></span> Agent 每日产出 · 持续更新</div>
    <h1>日常 · <span class="grad">智能作品集</span></h1>
    <p class="sub">这里汇集日常由 Agent 生成的研究报告、行业分析与数据可视化网页，按主题归档，随产出不断增补。</p>
  </header>

  <section class="stats">
    <div class="row">
      <div class="cell"><div class="num" id="statPages">0</div><div class="label">网页总数</div></div>
      <div class="cell"><div class="num" id="statCats">0</div><div class="label">主题分类</div></div>
      <div class="cell"><div class="num" id="statTags">0</div><div class="label">标签维度</div></div>
      <div class="cell"><div class="num" id="statLatest">—</div><div class="label">最近更新</div></div>
    </div>
  </section>

  <div class="toolbar">
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="q" type="text" placeholder="搜索标题 / 标签 / 关键词…" autocomplete="off">
    </div>
    <div class="cats" id="cats"></div>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <footer>
    <div>日常 · Agent 作品集 · 由 WorkBuddy 生成维护</div>
    <a class="gh" href="https://github.com/eastseao/rc" target="_blank" rel="noopener">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.75 2.69 1.25 3.34.96.1-.74.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.73.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.66.41.35.78 1.05.78 2.12 0 1.53-.01 2.76-.01 3.14 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
      github.com/eastseao/rc
    </a>
  </footer>

<script>
// ============================================================
// 子网页登记表：每新增一个页面，只需在下面数组里加一条记录
// ============================================================
const PAGES = [
  {
    title: "AI Agent 提效培训 · WorkBuddy 专题",
    desc: "面向食品生产企业的 AI Agent 培训课件（浅色商务风）：概念科普、Markdown/GitHub 技术预备、主流智能体盘点、七大业务场景实战、Typora 可视化交付与 Skill 方法论。",
    url: "ai-agent-training.html",
    date: "2026-09-08",
    category: "效率工具",
    tags: ["AI Agent", "WorkBuddy", "培训", "产品部"],
    gradient: "linear-gradient(135deg,#2b5cff,#8b7bff)",
    glyph: "🤖"
  },
  {
    title: "超强厄尔尼诺 · 2027年全维度影响分析",
    desc: "一次史无前例的超强厄尔尼诺（峰值或超 +3℃，冲有观测记录以来最强），从气候、粮食、能源、生态、健康、金融、基建到青海/西北本土视角的 14 维系统性研判。",
    url: "el-nino-2027-impact.html",
    date: "2026-09-08",
    category: "金融分析",
    tags: ["厄尔尼诺", "气候", "2027", "粮食安全", "能源"],
    gradient: "linear-gradient(135deg,#0b5d8a,#e0522f)",
    glyph: "🌏"
  },
  {
    title: "超强厄尔尼诺 · A股受益板块全维度分析",
    desc: "本轮厄尔尼诺大概率成为有观测记录以来最强，从天气→大宗商品→上市公司盈利的完整传导链，梳理糖、橡胶、种业、火电、家电、水利等七大受益主线与个股映射。",
    url: "el-nino-a-share-2026.html",
    date: "2026-09-08",
    category: "金融分析",
    tags: ["厄尔尼诺", "A股", "板块轮动", "农产品"],
    gradient: "linear-gradient(135deg,#f6d365,#fda085)",
    glyph: "🌊"
  },
  {
    title: "知乎句子十年 · 金句集",
    desc: "2015-2026 知乎金句精选（7611 条），含主题分布、时间分布、高赞 Top 20、跨帖流传等数据可视化分析。",
    url: "zhihu-juzi.html",
    date: "2026-09-08",
    category: "内容集锦",
    tags: ["知乎", "金句", "数据可视化"],
    gradient: "linear-gradient(135deg,#3b82f6,#8b5cf6)",
    glyph: "✍️"
  },
  {
    title: "Prompt 库",
    desc: "个人 Prompt 收藏管理器，支持搜索、分类、标签、收藏、一键复制、Ctrl+K 快捷搜索，数据存 GitHub 可追溯。",
    url: "prompt.html",
    date: "2026-09-04",
    category: "效率工具",
    tags: ["Prompt", "收藏", "效率"],
    gradient: "linear-gradient(135deg,#0ea5e9,#22c55e)",
    glyph: "⚡"
  },
  {
    title: "每日卜卦 · 六十四卦",
    desc: "易经六十四卦每日占卜工具，摇卦、解卦、卦辞爻辞一应俱全，国风美学界面。",
    url: "yijing.html",
    date: "2026-09-01",
    category: "生活工具",
    tags: ["易经", "卜卦", "六十四卦"],
    gradient: "linear-gradient(135deg,#a33327,#b98a2e)",
    glyph: "🔮"
  }
];

const CAT_COLORS = {
  "金融分析": "linear-gradient(135deg,#2f5cff,#00b4d8)"
};

function render() {
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const activeCat = document.querySelector('.cat.active');
  const cat = activeCat ? activeCat.dataset.cat : '全部';

  const cats = ['全部', ...Array.from(new Set(PAGES.map(p => p.category)))];
  const catBox = document.getElementById('cats');
  catBox.innerHTML = cats.map(c =>
    `<div class="cat${c === cat ? ' active' : ''}" data-cat="${c}">${c}</div>`
  ).join('');
  catBox.querySelectorAll('.cat').forEach(el => el.addEventListener('click', () => {
    catBox.querySelectorAll('.cat').forEach(x => x.classList.remove('active'));
    el.classList.add('active'); render();
  }));

  const filtered = PAGES.filter(p => {
    const okCat = cat === '全部' || p.category === cat;
    const hay = (p.title + ' ' + p.desc + ' ' + p.tags.join(' ') + ' ' + p.category).toLowerCase();
    const okQ = !q || hay.includes(q);
    return okCat && okQ;
  }).sort((a, b) => b.date.localeCompare(a.date));

  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty"><div class="big">🔍</div>没有找到匹配的页面，换个关键词试试</div>`;
  } else {
    grid.innerHTML = filtered.map(p => `
      <article class="card">
        <a href="${p.url}" class="thumb" style="background:${p.gradient};">
          <span class="cat-tag">${p.category}</span>
          <span class="glyph">${p.glyph}</span>
        </a>
        <div class="body">
          <h3><a href="${p.url}">${p.title}</a></h3>
          <div class="desc">${p.desc}</div>
          <div class="tags">${p.tags.map(t => `<span class="t"># ${t}</span>`).join('')}</div>
          <div class="foot">
            <span class="meta">📅 ${p.date}</span>
            <a class="open" href="${p.url}">阅读全文
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          </div>
        </div>
      </article>
    `).join('');
  }

  // stats
  document.getElementById('statPages').innerHTML = `<span>${PAGES.length}</span>`;
  document.getElementById('statCats').innerHTML = `<span>${new Set(PAGES.map(p => p.category)).size}</span>`;
  document.getElementById('statTags').innerHTML = `<span>${new Set(PAGES.flatMap(p => p.tags)).size}</span>`;
  const latest = PAGES.map(p => p.date).sort().pop();
  document.getElementById('statLatest').textContent = latest ? latest.slice(5).replace('-', '.') : '—';
}

document.getElementById('q').addEventListener('input', render);
render();
</script>
</body>
</html>
