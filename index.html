<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231b1917'/%3E%3Cpath d='M8 21h16M8 16h16M8 11h9' stroke='%23a16207' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">

<meta property="og:title" content="GERVAS · 杭州一人的作品档案">
<meta property="og:description" content="九类笔记、21 个工具，从 2023 年 10 月写到现在，全部能检索。">

<link rel="preload" href="assets/fonts/worksans-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Work Sans";font-style:normal;font-weight:300 600;font-display:swap;src:url("assets/fonts/worksans-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215;}
@font-face{font-family:"Work Sans";font-style:normal;font-weight:300 600;font-display:swap;src:url("assets/fonts/worksans-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+1E00-1E9F;}

:root{
  --paper:#e6e1d6;        /* 纸 */
  --paper-2:#d8d2c4;      /* 纸 · 色阶（标签页 / 截图兜底封面） */
  --ink:#1b1917;          /* 墨 */
  --ink-2:#5b554b;        /* 墨 · 次级（纸上的灰字） */
  --dark:#1b1917;         /* 深色场（hero / 页脚） */
  --accent:#a16207;       /* 赭 */
  --accent-strong:#7a4a05;/* 赭 · 深（按钮面，保证对比度） */
  --accent-press:#5e3a04;
  --fs-body:17px;
  --fs-display:clamp(64px,10vw,108px);
  --fs-h:clamp(28px,3.2vw,42px);
  --ease:cubic-bezier(.2,.7,.2,1);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--dark);color:var(--paper);
  font-family:"Work Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:var(--fs-body);line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
h1,h2,p,ul{margin:0}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.skip{position:absolute;left:-9999px;top:0;background:var(--paper);color:var(--ink);padding:10px 16px;z-index:30}
.skip:focus{left:16px;top:12px}

/* ══ 顶部细栏 ══════════════════════════════════ */
.top{
  background:var(--dark);
  display:flex;align-items:center;justify-content:space-between;
  padding:20px clamp(20px,4vw,48px);font-size:15px;
}
.top .wm{font-weight:600;letter-spacing:.02em;color:var(--paper)}
.top nav{display:flex;gap:22px}
.top nav a{color:#b9b2a4;transition:color .16s var(--ease)}
.top nav a:hover,.top nav a:focus-visible{color:var(--paper)}

/* ══ Hero：目录卡（page is the object） ══════════════ */
.hero{
  background:var(--dark);
  min-height:calc(100svh - 64px);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(40px,7vh,90px) clamp(20px,4vw,48px) clamp(56px,9vh,110px);
}
.card{
  position:relative;background:var(--paper);color:var(--ink);
  width:100%;max-width:580px;
  padding:clamp(44px,5vw,62px) clamp(34px,4.4vw,56px) clamp(36px,4vw,48px);
  margin-top:34px;
}
.card .tab{                       /* 文件夹标签页：物体化细节，非细线 */
  position:absolute;top:-32px;left:clamp(34px,4.4vw,56px);
  width:150px;height:34px;background:var(--paper-2);
  clip-path:polygon(0 100%,8% 0,92% 0,100% 100%);
}
.card h1{margin:0;font-size:var(--fs-display);line-height:.84;letter-spacing:-.045em;font-weight:600;color:var(--ink)}
.card .lede{margin:20px 0 30px;font-size:17px;line-height:1.5;max-width:34ch;color:var(--ink)}
.cats{list-style:none;padding:0;margin:0 0 34px;display:grid;grid-template-columns:1fr 1fr;gap:11px 26px}
.cats li{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--ink)}
.cats .n{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.btn{
  display:inline-block;background:var(--accent-strong);color:var(--paper);
  border:0;padding:15px 28px;font-size:16px;font-weight:600;
  font-family:inherit;cursor:pointer;
  transition:background .16s var(--ease),transform .16s var(--ease);
}
.btn:hover,.btn:focus-visible{background:var(--accent-press);transform:translateY(-1px)}
.since{margin:18px 0 0;font-size:13.5px;color:var(--ink-2)}

/* ══ 最近更新（浅场，承载真实截图） ══════════════════ */
.recent{background:var(--paper);color:var(--ink);padding:clamp(64px,9vh,120px) clamp(20px,4vw,48px)}
.recent .wrap{max-width:1120px;margin:0 auto}
.recent h2{margin:0 0 6px;font-size:var(--fs-h);font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.recent .sub{margin:0 0 40px;font-size:16px;color:var(--ink-2);max-width:48ch}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,26px)}
.work{display:block;color:var(--ink)}
.shot{position:relative;aspect-ratio:4/3;background:var(--paper-2);overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.shot.miss{display:flex;align-items:center;justify-content:center;padding:18px;text-align:center}
.shot.miss img{display:none}
.shot.miss::after{content:attr(data-t);font-size:18px;font-weight:600;line-height:1.2;color:var(--ink)}
.work:hover .shot img,.work:focus-visible .shot img{transform:scale(1.04)}
.work .t{margin:12px 0 0;font-size:16px;font-weight:600;line-height:1.25}
.work .m{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.more{display:inline-block;margin-top:42px;font-size:17px;font-weight:600;color:var(--ink);transition:color .16s var(--ease)}
.more:hover,.more:focus-visible{color:var(--accent)}

/* ══ 页脚：卡片的背面 ════════════════════════════ */
.foot{background:var(--dark);color:var(--paper);padding:clamp(56px,8vh,96px) clamp(20px,4vw,48px) 44px}
.foot .wrap{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px}
.foot .big{font-size:clamp(56px,11vw,150px);line-height:.82;letter-spacing:-.04em;font-weight:600;color:var(--paper)}
.foot nav{display:flex;flex-direction:column;gap:10px;font-size:15px}
.foot nav a{color:#b9b2a4;transition:color .16s var(--ease)}
.foot nav a:hover,.foot nav a:focus-visible{color:var(--paper)}
.foot .imprint{width:100%;margin-top:48px;font-size:13px;color:#8a8378}

/* ══ 入场动效（reduced-motion 安全） ════════════ */
@media (prefers-reduced-motion:no-preference){
  html.js .reveal{opacity:0;transform:translateY(20px)}
  html.js .reveal.in{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease)}
  html.js .reveal.d1{transition-delay:.07s}
  html.js .reveal.d2{transition-delay:.14s}
  html.js .reveal.d3{transition-delay:.21s}
}

@media (max-width:760px){
  .cats{grid-template-columns:1fr;gap:9px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .card{margin-top:30px}
}
@media (max-width:460px){
  .grid{grid-template-columns:1fr}
  .top nav{gap:16px}
}
</style>
<script>document.documentElement.className='js';</script>
</head>
<body>

<a class="skip" href="#recent">跳到最近更新</a>

<header class="top">
  <a class="wm" href="./">GERVAS</a>
  <nav aria-label="主导航">
    <a href="archive.html">档案</a>
    <a href="https://github.com/eastseao/rc">GitHub</a>
  </nav>
</header>

<main>
  <section class="hero" aria-labelledby="title">
    <article class="card reveal">
      <span class="tab" aria-hidden="true"></span>
      <h1 id="title">GERVAS</h1>
      <p class="lede">杭州一人，自 2023 年 10 月写下。815 篇开源笔记、21 个工具，九类跨度，全部可检索。</p>
      <ul class="cats" id="cats"></ul>
      <a class="btn" href="archive.html">浏览全部档案 →</a>
      <p class="since">自 2023 年 10 月 · 杭州</p>
    </article>
  </section>

  <section class="recent" id="recent" aria-labelledby="recent-h">
    <div class="wrap">
      <h2 id="recent-h" class="reveal">最近更新</h2>
      <p class="sub reveal d1">最新的几篇笔记与工具，下面是它们的真实截图。</p>
      <div class="grid" id="grid"></div>
      <a class="more reveal" href="archive.html">查看全部 815 篇 →</a>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <span class="big" aria-hidden="true">GERVAS</span>
    <nav aria-label="页脚导航">
      <a href="archive.html">全部档案</a>
      <a href="https://github.com/eastseao/rc">GitHub 仓库</a>
      <a href="./">返回首页</a>
    </nav>
    <p class="imprint">GERVAS · 杭州一人的开源作品档案 · 纯静态 · 可检索 · 自 2023</p>
  </div>
</footer>

<script src="manifest.js"></script>
<script>
(function(){
  'use strict';
  var W = window.WORKS || [];
  var slugOf = function(u){return (u||'').replace(/^pages\//,'').replace(/^tools\//,'').replace(/\/index\.html$/,'').replace(/\.html$/,'');};

  /* 九类数量 */
  var NAMES = ['建站与技术','AI与Agent','写作与创作','生活杂记','本草与健康','产品与渠道','包装包材','采购与供应链','博物与自然'];
  var counts = {};
  W.forEach(function(x){ if (x.c) counts[x.c] = (counts[x.c]||0)+1; });
  var cats = document.getElementById('cats');
  NAMES.forEach(function(n){
    var li = document.createElement('li');
    li.innerHTML = '<span>'+n+'</span><span class="n">'+(counts[n]||0)+'</span>';
    cats.appendChild(li);
  });

  /* 最近更新：按日期取最新 6 篇，显示真实截图 */
  var grid = document.getElementById('grid');
  if (!Array.isArray(W)) {
    grid.innerHTML = '<p style="font-size:18px">作品数据未能加载，请前往 <a href="archive.html" style="color:var(--accent)">档案</a>。</p>';
    return;
  }
  var sorted = W.filter(function(x){return x.d && x.t;}).sort(function(a,b){return String(b.d).localeCompare(String(a.d));});
  var shown = 0;
  sorted.forEach(function(w){
    if (shown >= 6) return;
    var s = slugOf(w.u);
    var a = document.createElement('a');
    a.className = 'work reveal' + (shown===0?' d1':shown===1?' d2':shown===2?' d3':'');
    a.href = w.u;
    var shot = document.createElement('div');
    shot.className = 'shot';
    shot.setAttribute('data-t', w.t);
    var img = new Image();
    img.src = 'assets/works/'+s+'.jpg';
    img.alt = w.t + ' 的页面截图';
    img.loading = 'lazy';
    img.onerror = function(){ shot.classList.add('miss'); };
    shot.appendChild(img);
    var t = document.createElement('p'); t.className='t'; t.textContent = w.t;
    var m = document.createElement('p'); m.className='m';
    m.textContent = (w.d||'') + (w.c?' · '+w.c:'');
    a.appendChild(shot); a.appendChild(t); a.appendChild(m);
    grid.appendChild(a);
    shown++;
  });
  if (!shown){
    grid.innerHTML = '<p style="font-size:18px">最近作品需要 JavaScript 才能显示，可直接前往 <a href="archive.html" style="color:var(--accent)">全部 815 篇档案</a>。</p>';
  }

  /* 入场：进入视口时点亮 */
  var els = [].slice.call(document.querySelectorAll('.reveal'));
  if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    els.forEach(function(el){ el.classList.add('in'); });
  } else {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { rootMargin:'0px 0px -10% 0px', threshold:0.12 });
    els.forEach(function(el){ io.observe(el); });
  }
})();
</script>
</body>
</html>
