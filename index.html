<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常 · Agent 作品集</title>
<meta name="description" content="日常 Agent 产出的网页合集 —— 行业研究 / 效率工具 / 金融分析，一份持续更新的个人工作记录。全部页面开源、数据可复现。">
<!--
  v5 首页改版（2026-09-21）
  视觉：全站统一主题（theme.css）—— 技术文档 / 深色侧栏（方案 C）
  结构：墨黑顶栏 → 发文式页头 → grid(250px 深色目录 + 1fr 白卡正文) → 分带页脚
  正文：精选头条（参与筛选）+ 卡片网格
  数据：PAGES 登记表为唯一数据源；新增一条即自动进入列表、统计、目录与页脚「最近更新」
  注意：页面位于域名根，站内链接不带 /rc/ 前缀
-->
<link rel="stylesheet" href="theme.css">
<style>

  /* ── 首页专属体例变量（主题 token 一律来自 theme.css） ───────────
     版式：技术文档 / 深色侧栏（方案 C）
     墨黑顶栏 → 发文式页头 → grid(250px + 1fr) 主体 → 分带页脚       */
  :root{
    --bar-h:50px;
    --sidew:250px;
    --gap:34px;
    --side-bg:#141c2b;
    --side-ink:#94a3b8;
    --side-ink-hi:#5eead4;
    --side-hi:rgba(13,148,136,.18);
    --side-mut:#5b6b80;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.76;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  section{scroll-margin-top:calc(var(--bar-h) + 14px)}

  /* ── 1. 顶栏（墨黑） ─────────────────────────────── */
  .s-bar{position:sticky;top:0;z-index:50;background:#0f172a;color:#f1f5f9}
  /* 外壳通栏（--maxw = none）：靠 padding 留呼吸位，桌面 32px。
     ⚠️ 别再写死 max-width —— 版心宽度只在 theme.css 的 --maxw* 三个 token 里改。 */
  .s-bar-in{max-width:var(--maxw);margin:0 auto;padding:0 32px;height:var(--bar-h);display:flex;align-items:center;gap:12px}
  .s-brand{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.1em;white-space:nowrap;color:#fff}
  .s-brand em{font-style:normal;font-size:12px;font-weight:400;color:var(--side-ink);letter-spacing:.02em;margin-inline-start:8px}
  /* ⚠️ 基础态不写 overflow-x:auto：它会让 overflow-y 隐式变 auto。
     桌面分类项在 --maxw 内放得下，无需滚动；窄屏断点里再开横滑。 */
  .s-nav{margin-inline-start:auto;display:flex;align-items:center;gap:2px;font-size:13px}
  .s-nav a{padding:5px 11px;border-radius:var(--radius-sm);color:var(--side-ink);white-space:nowrap;transition:.15s}
  .s-nav a:hover{color:#f1f5f9}
  .s-nav a.on{color:#f1f5f9;background:var(--side-hi);font-weight:600}
  .s-nav a .cnt{font-family:var(--mono);font-size:11px;color:#8b98ab;margin-inline-start:5px}
  .s-nav a.on .cnt{color:var(--side-ink-hi)}
  .s-search{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-sm);color:var(--side-ink);transition:.15s;flex:0 0 auto}
  .s-search:hover{color:#fff;background:rgba(255,255,255,.09)}

  /* ── 2. 发文式页头 ───────────────────────────────── */
  .s-head{max-width:var(--maxw-read);margin:0 auto;padding:44px 32px 0}
  .s-eyebrow{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent)}
  .s-eyebrow::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .s-h1{font-size:clamp(23px,2.9vw,32px);font-weight:700;letter-spacing:-.014em;line-height:1.28;margin:14px 0 12px}
  .s-h1 .dot{color:var(--line-2);font-weight:400;margin:0 .1em}
  .s-lede{color:var(--muted);font-size:14.5px;line-height:1.8;max-width:var(--maxw-text)}
  .s-meta{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--muted-2);display:flex;flex-wrap:wrap;gap:6px 16px}
  .s-meta b{color:var(--ink);font-weight:700}

  /* ── 3. 主体：深色侧栏 + 白卡正文 ─────────────────── */
  /* ══ 主体：单栏正文（原深色侧栏目录已并入顶栏分类导航） ══ */
  .s-body{max-width:var(--maxw-read);margin:0 auto;padding:26px 32px 50px}
  .s-main{min-width:0;max-width:var(--maxw-read);margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 34px 40px}

  /* ── 4. 精选块（正文内的头条，不再是全宽深色带） ───── */
  .lead-wrap[hidden]{display:none}
  .lead{margin-top:22px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);
    background:#fbfcfd;padding:20px 22px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:26px;align-items:center}
  .lead.no-shot{grid-template-columns:1fr}
  .lead-tag{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;
    color:var(--accent);background:#fff;border:1px solid var(--accent);border-radius:999px;padding:2px 9px}
  .lead h2{font-size:19px;font-weight:700;letter-spacing:-.012em;line-height:1.42;margin:12px 0 10px}
  .lead h2 a:hover{color:var(--accent-ink)}
  .lead p{font-size:13.5px;color:var(--ink-2);line-height:1.72}
  .lead-meta{font-family:var(--mono);font-size:11px;color:var(--muted-2);letter-spacing:.03em;margin:12px 0 14px}
  .lead-shot{display:block;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);background:var(--band)}
  .lead-shot img{display:block;width:100%;height:auto}

  .link-arrow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--accent);font-family:var(--mono)}
  .link-arrow svg{transition:transform .18s}
  .link-arrow:hover svg{transform:translateX(3px)}

  /* ── 5. 章节标题行 + 卡片网格 ─────────────────────── */
  .sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:30px 0 14px}
  .sec-h h2{font-size:19px;font-weight:700;letter-spacing:-.012em;line-height:1.4}
  .sec-h .n{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);
    border-radius:var(--radius-sm);padding:2px 9px;font-weight:700}
  .sec-h .hint{font-family:var(--mono);font-size:11px;color:var(--muted-2)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px 15px;
    display:flex;flex-direction:column;scroll-margin-top:calc(var(--bar-h) + 20px);
    transition:border-color .18s,box-shadow .18s,transform .18s}
  .card:hover{border-color:var(--accent);box-shadow:var(--shadow-hover);transform:translateY(-1px)}
  .card .crow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .card .cat{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--accent-ink)}
  .card .date{font-family:var(--mono);font-size:11px;color:var(--muted-2)}
  .card h3{font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.52;margin:10px 0 8px}
  .card h3 a:hover{color:var(--accent-ink)}
  .card .desc{font-size:13px;color:var(--muted);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
  .card .tags .k{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:3px 7px}
  .card .tags .t{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--band);border-radius:999px;padding:3px 9px}
  .card .foot{margin-top:auto;padding-top:14px}

  .card.personal{background:var(--band);border-color:transparent}
  .card.personal .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted-2)}
  .card.personal h3{font-size:17px;margin-top:8px}
  .card.personal .chip-mini{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 12px}

  .empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--radius)}
  .empty .big{font-family:var(--mono);font-size:26px;margin-bottom:8px;opacity:.5}

  /* ── 6. 页脚 ─────────────────────────────────────── */
  .s-foot{background:var(--band);border-top:1px solid var(--line)}
  .s-foot-in{max-width:var(--maxw);margin:0 auto;padding:40px 32px 30px;display:grid;grid-template-columns:1.6fr 1fr 1.2fr 1fr;gap:30px}
  .fcol h4{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink);margin-bottom:13px}
  .fcol .fbrand{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:.16em;margin-bottom:11px}
  .fcol p{font-size:13px;color:var(--muted);line-height:1.75;max-width:320px}
  .fcol a{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);padding:3px 0}
  .fcol a:hover{color:var(--accent-ink)}
  .fcol a .recent-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fcol a .recent-d{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--muted-2)}
  .watermark{max-width:var(--maxw);margin:0 auto;padding:0 32px}
  .watermark span{display:block;font-family:var(--mono);font-weight:700;letter-spacing:.005em;
    font-size:clamp(34px,6.8vw,78px);line-height:1;color:#dfe6ef;white-space:nowrap;user-select:none}
  .legal{max-width:var(--maxw);margin:0 auto;padding:18px 32px 26px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;
    font-family:var(--mono);font-size:11.5px;color:var(--muted-2)}

  /* ── 7. 响应式 ───────────────────────────────────── */
  @media (max-width:1180px) and (min-width:901px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:900px){
    .s-nav{overflow-x:auto;scrollbar-width:none}
    .s-nav::-webkit-scrollbar{display:none}
    .s-main{padding:8px 18px 30px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
    .lead{grid-template-columns:1fr;gap:18px;padding:18px}
    .lead-shot{order:-1}
    .s-foot-in{grid-template-columns:1fr 1fr;gap:26px}
  }
  @media (max-width:640px){
    .s-brand em{display:none}
    .s-nav a{padding:5px 8px;font-size:12.5px}
    .s-nav a .cnt{display:none}
    .s-bar-in,.s-head,.s-body,.s-foot-in,.watermark,.legal{padding-inline:16px}
    .s-head{padding:30px 16px 0}
    .grid{grid-template-columns:1fr}
    .s-foot-in{grid-template-columns:1fr;gap:22px;padding-top:32px}
    .watermark span{font-size:clamp(28px,10.5vw,50px)}
  }
</style>
</head>

    kicker: "PERSONAL",
    title: "关于这个站点",
    desc: "工业研究与 Agent 工具化的工作记录。全部页面开源、数据可复现，欢迎自取。",

// 顶栏 / 侧栏分类的固定顺序（其余分类自动追加到末尾）
const CAT_ORDER = ["行业研究", "效率工具", "金融分析", "生活"];

const ARROW = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

let currentCat = "全部";
let keyword = "";

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function pad2(n){ return (n < 10 ? "0" : "") + n; }

/* ── 数据派生 ─────────────────────────────────────── */
function articles(){ return PAGES.filter(p => !p.personal).slice().sort((a,b) => b.date.localeCompare(a.date)); }
/* 当前筛选结果（分类 + 关键词） */
function filtered(){ return articles().filter(match); }
/* 精选条目：只在「当前筛选结果」里找 —— 切到别的分类时不会串台 */
function featured(){ return filtered().find(x => x.feature) || null; }
/* 网格条目：当前筛选结果去掉精选那一条 */
function gridItems(){ const f = featured(); return filtered().filter(p => p !== f); }
function categories(){
  const set = [];
  CAT_ORDER.forEach(c => { if (articles().some(p => p.category === c)) set.push(c); });
  articles().forEach(p => { if (p.category && set.indexOf(p.category) < 0) set.push(p.category); });
  return set;
}
function catCount(c){ return articles().filter(p => p.category === c).length; }
function match(p){
  const okCat = currentCat === "全部" || p.category === currentCat;
  if (!okCat) return false;
  if (!keyword) return true;
  const hay = (p.title + " " + p.desc + " " + p.tags.join(" ") + " " + p.category + " " + (p.kind || "")).toLowerCase();
  return hay.indexOf(keyword.toLowerCase()) >= 0;
}

/* ── 顶栏分类导航（左栏目录已删除，筛选状态只由顶栏承载） ── */
function navItems(){
  return [["全部", articles().length]].concat(categories().map(c => [c, catCount(c)]));
}
function renderNav(){
  const nav = document.getElementById('catnav');
  nav.innerHTML = navItems().map(([c,n]) =>
    `<a href="#works" data-cat="${esc(c)}">${esc(c)}<span class="cnt">${n}</span></a>`).join('');
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setCat(a.dataset.cat)));
  syncActive();
}
function syncActive(){
  document.querySelectorAll('#catnav a').forEach(a => {
    const on = a.dataset.cat === currentCat;
    a.classList.toggle('on', on);
    if (on) { a.setAttribute('aria-current', 'true'); } else { a.removeAttribute('aria-current'); }
  });
}
function setCat(cat){
  currentCat = cat;
  syncActive();
  renderFeature();
  renderGrid();
  /* 结果区在视口下方时才滚过去（窄屏顶栏筛选后需要这一下；桌面端无感） */
  const el = document.getElementById('works');
  if (el && el.getBoundingClientRect().top > window.innerHeight * 0.82) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

/* ── 精选头条 ─────────────────────────────────────── */
function renderFeature(){
  const box = document.getElementById('feature');
  const p = featured();
  if (!p) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  const shot = p.image
    ? `<a class="lead-shot" href="${p.url}" aria-label="${esc(p.title)}"><img src="${p.image}" alt="${esc(p.imageAlt || p.title)}" loading="lazy" width="1344" height="816"></a>`
    : '';
  box.innerHTML = `
    <div class="lead${shot ? '' : ' no-shot'}">
      <div>
        <span class="lead-tag">精选 · ${esc(p.category)}${p.kind ? ' · ' + esc(p.kind) : ''}</span>
        <h2><a href="${p.url}">${esc(p.title)}</a></h2>
        <p>${esc(p.desc)}</p>
        <div class="lead-meta">${esc(p.date)} · ${p.tags.slice(0,3).map(esc).join(' / ')}</div>
        <a class="link-arrow" href="${p.url}">阅读全文 ${ARROW}</a>
      </div>
      ${shot}
    </div>`;
}

/* ── 章节标题行 ───────────────────────────────────── */
function renderWorksHead(){
  document.getElementById('works-title').textContent =
    keyword ? '搜索结果' : (currentCat === '全部' ? '全部作品' : currentCat);
  document.getElementById('list-count').textContent = filtered().length;
  document.getElementById('works-hint').textContent = keyword ? '· 「' + keyword + '」' : '';
}

/* ── 卡片网格 ─────────────────────────────────────── */
function renderGrid(){
  const grid = document.getElementById('grid');
  const list = gridItems();
  const personal = PAGES.filter(p => p.personal);

  let html = list.map(p => `
    <article class="card">
      <div class="crow"><span class="cat">${esc(p.category)}</span><span class="date">${esc(p.date)}</span></div>
      <h3><a href="${p.url}">${esc(p.title)}</a></h3>
      <div class="desc">${esc(p.desc)}</div>
      <div class="tags">${p.kind ? `<span class="k">${esc(p.kind)}</span>` : ''}${p.tags.slice(0,3).map(t => `<span class="t"># ${esc(t)}</span>`).join('')}</div>
      <div class="foot"><a class="link-arrow" href="${p.url}">阅读全文 ${ARROW}</a></div>
    </article>`).join('');

  /* 「关于」卡仅在「全部 + 无搜索」时出现在网格末位 */
  if (currentCat === "全部" && !keyword) {
    html += personal.map(p => `
      <article class="card personal" id="about">
        <span class="kicker">${esc(p.kicker)}</span>
        <h3>${esc(p.title)}</h3>
        <div class="desc">${esc(p.desc)}</div>
        <div class="tags">${p.tags.map(t => `<span class="chip-mini">${esc(t)}</span>`).join('')}</div>
        <div class="foot"><a class="link-arrow" href="${p.url}" target="_blank" rel="noopener">${esc(p.cta)} ${ARROW}</a></div>
      </article>`).join('');
  }

  grid.innerHTML = html || `<div class="empty"><div class="big">[ 空 ]</div>没有匹配的作品${keyword ? `：<b>${esc(keyword)}</b>` : ''}</div>`;
  renderWorksHead();
}

/* ── 页脚两栏：跟随登记表自动派生 ───────────────── */
function renderFooterCats(){
  const box = document.getElementById('f-cat');
  box.innerHTML = '<h4>内容</h4>' + categories().map(c =>
    `<a href="#works" data-cat="${esc(c)}">${esc(c)}<span class="recent-d">${catCount(c)}</span></a>`).join('');
  box.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setCat(a.dataset.cat)));
}
function renderFooterRecent(){
  const top = articles().slice(0, 4);
  document.getElementById('f-recent').innerHTML = '<h4>最近更新</h4>' + top.map(p =>
    `<a href="${p.url}" title="${esc(p.title)}"><span class="recent-t">${esc(p.title)}</span><span class="recent-d">${esc(p.date.slice(5))}</span></a>`).join('');
}
/* 页头统计 */
function renderMeta(){
  document.getElementById('stat-pages').textContent = articles().length;
  document.getElementById('stat-cats').textContent = categories().length;
  const newest = articles()[0];
  document.getElementById('stat-updated').textContent = newest ? newest.date : '—';
}

/* ── 顶栏搜索：就地弹出输入框，实时过滤 ─────────── */
function initSearch(){
  const btn = document.getElementById('searchbtn');
  let panel = null;
  btn.addEventListener('click', () => {
    if (panel) { close(); return; }
    panel = document.createElement('div');
    panel.style.cssText = 'position:fixed;inset-inline:0;top:var(--bar-h);z-index:49;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 32px;display:flex;justify-content:center';
    panel.innerHTML = '<div style="max-width:var(--maxw-read);width:100%;display:flex;align-items:center;gap:10px">'
      + '<input id="q" type="search" placeholder="搜索标题、摘要或标签…" style="flex:1;font:inherit;font-size:15px;padding:10px 14px;border:1px solid var(--line-2);border-radius:8px;outline:none;background:var(--surface);color:var(--ink)">'
      + '<button id="qclose" type="button" style="font-size:13px;color:var(--muted);padding:8px">关闭</button></div>';
    document.body.appendChild(panel);
    const input = panel.querySelector('#q');
    input.focus();
    input.addEventListener('input', () => { keyword = input.value.trim(); renderFeature(); renderGrid(); });
    panel.querySelector('#qclose').addEventListener('click', close);
    input.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  });
  function close(){
    if (panel) { panel.remove(); panel = null; }
    keyword = '';
    renderFeature();
    renderGrid();
  }
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); btn.click(); }
  });
}

/* ── 「关于我」入口：先回到全部态，再滚到关于卡 ── */
function initAbout(){
  document.querySelectorAll('[href="#about"], [data-about]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      if (currentCat !== "全部" || keyword) { setCat("全部"); }
      const el = document.getElementById('about');
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    });
  });
}

renderMeta();
renderNav();
renderFeature();
renderGrid();
renderFooterCats();
renderFooterRecent();
initSearch();
initAbout();
</script>
