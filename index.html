<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERVAS · AI × Tools × Design × Life</title>
<meta name="description" content="GERVAS 的个人站：AI × Tools × Design × Life。喜欢研究新技术，也喜欢做一些东西。写下来，做出来，然后继续探索。">
<link rel="canonical" href="https://eastseao.github.io/rc/">
<meta property="og:type" content="website">
<meta property="og:title" content="GERVAS · AI × Tools × Design × Life">
<meta property="og:description" content="AI × Tools × Design × Life —— 写下来，做出来，然后继续探索。">
<meta property="og:url" content="https://eastseao.github.io/rc/">
<meta name="twitter:card" content="summary">
<style>
:root{
  --bg:#fdfcf9; --fg:#211f1c; --muted:#8a857f; --line:#e7e5e4;
  --accent:#c2410c; --accent-ink:#9a3412; --soft:rgba(194,65,12,.07);
  --serif:Georgia,'Times New Roman','Songti SC','Noto Serif SC','SimSun',serif;
  --sans:system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --mono:ui-monospace,'Cascadia Mono','Consolas','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.65;font-size:16px;
  background-image:linear-gradient(0deg,rgba(0,0,0,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.012) 1px,transparent 1px);
  background-size:22px 22px;}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:780px;margin:0 auto;padding:0 24px}
.w-count{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-bottom:10px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* header */
.site-head{position:sticky;top:0;z-index:20;background:rgba(253,252,249,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;justify-content:space-between;align-items:center;height:56px}
.brand{font-family:var(--mono);font-weight:700;letter-spacing:.1em;font-size:.9rem;color:var(--fg)}
.nav-links{display:flex;gap:20px;flex-wrap:wrap}
.nav-links a{font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.nav-links a:hover{color:var(--accent-ink);text-decoration:none}

/* hero */
.hero{padding:72px 0 46px;border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--serif);font-size:clamp(2.9rem,7vw,3.7rem);font-weight:600;letter-spacing:.01em;line-height:1.08}
.hero .tag{font-family:var(--mono);color:var(--accent-ink);font-size:.85rem;margin-top:12px;letter-spacing:.14em}
.hero .intro{margin-top:26px;font-family:var(--serif);color:var(--muted);font-size:1.08rem;line-height:1.9}
.hero .intro p+p{margin-top:4px}

/* sections */
.sec{padding:46px 0;border-bottom:1px solid var(--line)}
.sec-label{font-family:var(--mono);font-size:.72rem;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
.sec-label::before{content:"// ";color:var(--accent)}

/* about */
.about-line{font-family:var(--serif);font-size:1.1rem;line-height:2}
.about-line .dot{color:var(--accent);margin:0 10px}
.about-extra{margin-top:18px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.about-extra a{color:var(--accent-ink)}

/* works */
.w-stats{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-bottom:16px}
.w-stats b{color:var(--accent-ink);font-weight:600}
.w-card{border:1px solid var(--line);border-radius:8px;padding:18px 18px 16px;margin-bottom:14px;background:rgba(255,255,255,.55)}
.w-card h3{font-family:var(--serif);font-size:1.12rem;font-weight:600}
.w-card h3 a{color:var(--fg)}
.w-card h3 a:hover{color:var(--accent-ink)}
.w-desc{color:var(--muted);font-size:.92rem;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w-meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:11px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:0}
.w-kind{color:var(--accent-ink)}
.w-tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.68rem}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 14px}
.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-family:var(--mono);font-size:.83rem;background:#fff;color:var(--fg)}
.search:focus{outline:none;border-color:var(--accent)}
.chips-filter{display:flex;flex-wrap:wrap;gap:8px}
.chip-f{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-family:var(--mono);font-size:.72rem;cursor:pointer;background:transparent;color:var(--muted);font-family:var(--mono)}
.chip-f:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip-f.on{background:var(--soft);border-color:var(--accent);color:var(--accent-ink)}
.a-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:10px 2px;border-bottom:1px dashed var(--line)}
.a-row .a-t{color:var(--fg);font-family:var(--serif);font-size:.98rem}
.a-row .a-t:hover{color:var(--accent-ink)}
.a-row .a-meta{font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap}
.more-btn{display:inline-block;margin:16px auto 0;border:1px solid var(--line);border-radius:8px;padding:9px 22px;font-family:var(--mono);font-size:.8rem;color:var(--accent-ink);background:#fff;cursor:pointer;text-align:center}
.more-btn:hover{border-color:var(--accent)}
.empty{font-family:var(--mono);color:var(--muted);font-size:.85rem;padding:20px 0}

/* footer */
.site-foot{padding:34px 0 60px;font-family:var(--mono);font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.site-foot a{color:var(--accent-ink)}

@media (max-width:560px){
  .hero{padding:52px 0 34px}
  .sec{padding:36px 0}
  .a-row{flex-direction:column;gap:2px}
}
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap nav">
    <a class="brand" href="#">GERVAS</a>
    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#works">作品</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- hero -->
  <section class="hero">
    <h1>GERVAS</h1>
    <p class="tag">AI × Tools × Design × Life</p>
    <div class="intro">
      <p>我喜欢研究新技术，也喜欢做一些东西。</p>
      <p>写下来，做出来，然后继续探索。</p>
    </div>
  </section>

  <!-- about -->
  <section class="sec" id="about">
    <h2 class="sec-label">About</h2>
    <p class="about-line">GERVAS <span class="dot">·</span>包装解决方案 <span class="dot">·</span>AI 爱好者 <span class="dot">·</span>独立开发探索者 <span class="dot">·</span>杭州</p>
    <p class="about-extra">作品库 <span id="about-count">810</span> 篇 · 全部开源 · 数据可复现 — <a href="https://github.com/eastseao/rc">github.com/eastseao/rc</a></p>
  </section>

  <!-- works -->
  <section class="sec" id="works">
    <h2 class="sec-label">作品</h2>
    <p class="w-stats" id="w-stats"></p>
    <div id="w-latest"></div>

    <h3 class="sec-label" id="all-label" style="margin-top:30px">全部作品</h3>
    <div class="toolbar">
      <label class="sr-only" for="w-search">搜索作品</label>
      <input class="search" id="w-search" type="search" placeholder="搜索标题 / 摘要 / 标签…" autocomplete="off">
      <div class="chips-filter" id="w-chips"></div>
    </div>
    <p class="w-count" id="w-count"></p>
    <div id="w-archive"></div>
    <p style="text-align:center"><button class="more-btn" id="w-more" type="button">显示更多</button></p>
    <p class="empty" id="w-empty" style="display:none">没有匹配的作品。</p>
  </section>
</main>

<footer class="wrap site-foot">
  <span>© 2026 GERVAS</span>
  <span><a href="https://eastseao.github.io/rc/">eastseao.github.io/rc</a></span>
</footer>

<script src="manifest.js"></script>
<script>
(function () {
  'use strict';
  var WORKS = window.WORKS;
  if (!Array.isArray(WORKS)) {
    var box = document.getElementById('w-archive');
    if (box) box.innerHTML = '<p class="empty">作品数据加载失败，请刷新页面重试。</p>';
    return;
  }

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };
  var sorted = WORKS.slice().sort(function (a, b) { return (b.d || '').localeCompare(a.d || ''); });
  var state = { cat: '全部', q: '', shown: 60 };

  // ---- stats + 分类 chips ----
  var cats = {};
  sorted.forEach(function (w) { cats[w.c] = (cats[w.c] || 0) + 1; });
  var catKeys = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; });

  $('w-stats').innerHTML = '<b>' + sorted.length + '</b> 篇作品 · <b>' + catKeys.length +
    '</b> 个分类 · 更新至 <b>' + (sorted[0] ? sorted[0].d : '-') + '</b>';

  var aboutCount = $('about-count');
  if (aboutCount) aboutCount.textContent = sorted.length;

  var chipsWrap = $('w-chips');
  function chipHtml(key, label, on) {
    return '<button type="button" class="chip-f' + (on ? ' on' : '') + '" data-cat="' +
      esc(key) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + esc(label) + '</button>';
  }
  chipsWrap.innerHTML = chipHtml('全部', '全部 (' + sorted.length + ')', true) +
    catKeys.map(function (c) { return chipHtml(c, c + ' (' + cats[c] + ')', false); }).join('');

  // ----最新 10篇卡片 ----
  $('w-latest').innerHTML = sorted.slice(0, 10).map(function (w) {
    var tags = (w.g || []).slice(0, 3).map(function (t) {
      return '<span class="w-tag">' + esc(t) + '</span>';
    }).join('');
    return '<article class="w-card"><h3><a href="' + esc(w.u) + '">' + esc(w.t) + '</a></h3>' +
      (w.desc ? '<p class="w-desc">' + esc(w.desc) + '</p>' : '') +
      '<p class="w-meta"><span class="w-kind">' + esc(w.k) + '</span><span>' + esc(w.c) +
      '</span><span>' + esc(w.d) + '</span>' + tags + '</p></article>';
  }).join('');

  // ---- 归档列表 ----
  function filtered() {
    return sorted.filter(function (w) {
      if (state.cat !== '全部' && w.c !== state.cat) return false;
      if (state.q) {
        var hay = (w.t + ' ' + (w.desc || '') + ' ' + (w.g || []).join(' ')).toLowerCase();
        if (hay.indexOf(state.q) < 0) return false;
      }
      return true;
    });
  }
  function renderArchive() {
    var list = filtered();
    var slice = list.slice(0, state.shown);
    $('w-count').textContent = '共 ' + list.length + ' 篇' +
      (list.length > state.shown ? '，显示前 ' + state.shown + ' 篇' : '');
    $('w-archive').innerHTML = slice.map(function (w) {
      return '<div class="a-row"><a class="a-t" href="' + esc(w.u) + '">' + esc(w.t) +
        '</a><span class="a-meta">' + esc(w.c) + ' · ' + esc(w.d) + ' · ' + esc(w.k) + '</span></div>';
    }).join('');
    $('w-more').style.display = list.length > state.shown ? 'inline-block' : 'none';
    $('w-empty').style.display = list.length ? 'none' : 'block';
    $('w-archive').style.display = list.length ? 'block' : 'none';
  }

  chipsWrap.addEventListener('click', function (e) {
    var b = e.target.closest('.chip-f');
    if (!b) return;
    state.cat = b.getAttribute('data-cat');
    state.shown = 60;
    chipsWrap.querySelectorAll('.chip-f').forEach(function (x) {
      var on = x === b;
      x.classList.toggle('on', on);
      x.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    renderArchive();
  });
  $('w-search').addEventListener('input', function (e) {
    state.q = e.target.value.trim().toLowerCase();
    state.shown = 60;
    renderArchive();
  });
  $('w-more').addEventListener('click', function () {
    state.shown += 60;
    renderArchive();
  });

  renderArchive();
})();
</script>
</body>
</html>
