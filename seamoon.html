<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>地平线 · 个人博客站</title>
<meta name="description" content="个人博客「地平线」（seamoonappear.github.io）站内入口：影评、随笔与生活记录。" />
<style>
  :root{
    --bg:#faf9f7; --surface:#fffefb; --ink:#1c1b1a; --muted:#6d6a63; --border:#e6e3dc;
    --code:#f4f2ed; --accent:#c96442; --accent-ink:#a2431f;
    --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
    --sans:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
  a:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}

  .topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
    padding:10px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .brand{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.02em;text-decoration:none;color:var(--ink)}
  .brand em{font-style:normal;color:var(--accent-ink)}
  .actions{display:flex;align-items:center;gap:8px}
  .actions a{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted);
    border:1px solid var(--border);border-radius:3px;padding:5px 12px;background:var(--bg);text-decoration:none;
    transition:color .15s,border-color .15s;white-space:nowrap}
  .actions a:hover{color:var(--accent-ink);border-color:var(--accent)}
  .actions a.dark{background:var(--ink);border-color:var(--ink);color:#faf9f7}
  .actions a.dark:hover{background:var(--accent);border-color:var(--accent)}

  .stage{position:relative;height:calc(100vh - 45px);height:calc(100dvh - 45px);background:var(--surface)}
  .stage iframe{display:block;width:100%;height:100%;border:0;background:#fff}
  .loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:var(--bg);color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.06em;z-index:5}
  .loader.hide{display:none}
  .loader .spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader .alt{margin-top:6px}
  .loader .alt a{color:var(--accent-ink)}
  @media (max-width:640px){.topbar{padding:10px 14px}.actions a{padding:4px 9px;font-size:11px}}
</style>
</head>
<body>

<header class="topbar" data-od-id="topbar">
  <a class="brand" href="index.html">日常<em>·</em>地平线 · 个人博客站</a>
  <div class="actions">
    <a href="https://seamoonappear.github.io/" target="_blank" rel="noopener">↗ 原站新窗口</a>
    <a class="dark" href="index.html">返回首页</a>
  </div>
</header>

<div class="stage" data-od-id="stage">
  <div class="loader" id="loader">
    <span class="spin"></span>
    <span>正在加载「地平线」…</span>
    <span class="alt">若长时间未显示，可直接 <a href="https://seamoonappear.github.io/" target="_blank" rel="noopener">在新窗口打开原站</a></span>
  </div>
  <iframe id="frame" src="https://seamoonappear.github.io/" title="地平线 · 个人博客站" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<script>
  (function(){
    var frame = document.getElementById('frame');
    var loader = document.getElementById('loader');
    var done = false;
    function hide(){ if (!done) { done = true; loader.classList.add('hide'); } }
    frame.addEventListener('load', hide);
    // 兜底：8 秒后无论是否触发 load 都移除加载层，避免遮罩卡死
    setTimeout(hide, 8000);
  })();
</script>
</body>
</html>
